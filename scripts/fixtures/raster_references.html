<!doctype html>
<!--
  Draws crates/excali-raster/tests/fixtures/display-lists/*.json on a real
  CanvasRenderingContext2D (ex-401). Run through
  scripts/fixtures/raster-references.sh, which puts the fixtures in place of
  the FIXTURES marker below, loads the page in headless Chrome and keeps the
  PNG each canvas becomes.

  Upstream renders by calling the Canvas 2D API (renderElement.ts,
  staticScene.ts), so a real canvas is the specification the tiny-skia
  backend is compared with. This page is an independent reading of the
  display list: every call goes to the canvas as the list describes it, and
  the browser applies its own rules (paths through the native rect,
  roundRect and arc, dash lists through setLineDash, colours through
  fillStyle, matrices through transform, opacity through globalAlpha).
  Nothing here reuses the port's code.

  The drawing functions (trace, draw, call, loadImage, bitmap) are in
  raster_references.js beside this page, which the Canvas 2D backend's
  fixture check (tests/web/canvas2d, ex-502) loads too.

  Fixture vocabulary (tests/fixtures/README.md in excali-raster):
  numbers may be "NaN", "Infinity" or "-Infinity".

  Images given as a dataUrl are img elements the browser decodes with its
  own codecs (as upstream's loadHTMLImageElement does); the page draws once
  the window's load event says every one of them has loaded. A fixture with
  canvasCalls (upstream's own recorded calls, see image-elements.json) is
  drawn by replaying those calls instead of its items, with upstream's
  placeholder SVGs as data:image/svg+xml,encodeURIComponent(svg) images.
-->
<html><body><pre id="out"></pre>
<script src="raster_references.js"></script>
<script>
const FIXTURES = /*FIXTURES*/null;

const out = { userAgent: navigator.userAgent, png: {}, errors: {} };
const prepared = {};
for (const [name, fixture] of Object.entries(FIXTURES)) {
  try {
    const images = {};
    for (const [id, spec] of Object.entries(fixture.images || {})) images[id] = bitmap(spec);
    // Built-in images (excalidraw:image-placeholder, ...) the items name by
    // id: upstream's own data URLs.
    for (const [id, url] of Object.entries(fixture.builtinImages || {})) images[id] = loadImage(url);
    const placeholders = {};
    for (const [kind, svg] of Object.entries(fixture.placeholders || {})) {
      placeholders[kind] = loadImage(`data:image/svg+xml,${encodeURIComponent(svg)}`);
    }
    prepared[name] = { images, placeholders };
  } catch (e) {
    out.errors[name] = String(e && e.stack || e);
  }
}

window.addEventListener("load", () => {
  for (const [name, fixture] of Object.entries(FIXTURES)) {
    if (!prepared[name]) continue;
    try {
      const { images, placeholders } = prepared[name];
      for (const img of [...Object.values(images), ...Object.values(placeholders)]) {
        if (img instanceof HTMLImageElement && !(img.complete && img.naturalWidth > 0)) {
          throw new Error(`image did not load: ${img.src.slice(0, 60)}`);
        }
      }
      const canvas = document.createElement("canvas");
      canvas.width = fixture.width;
      canvas.height = fixture.height;
      const ctx = canvas.getContext("2d", { colorSpace: "srgb" });
      // bootstrapCanvas (renderer/helpers.ts:73-127): context.scale(scale, scale).
      const scale = "scale" in fixture ? num(fixture.scale) : 1;
      ctx.scale(scale, scale);
      if (fixture.canvasCalls) {
        for (const c of fixture.canvasCalls) call(ctx, c, images, placeholders);
      } else {
        for (const item of fixture.items) draw(ctx, item, images);
      }
      out.png[name] = canvas.toDataURL("image/png");
    } catch (e) {
      out.errors[name] = String(e && e.stack || e);
    }
  }
  document.getElementById("out").textContent = JSON.stringify(out);
});
</script></body></html>
