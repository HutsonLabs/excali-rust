# ex-515: the keyboard handling's browser harness. A wasm module (built by
# scripts/web/keyboard.sh with wasm-bindgen --target web) that takes the
# page's real keydown, keyup, clipboard and pointer events through
# excali_ui::keyboard into excali_editor::keyboard (App.onKeyDown and
# App.onKeyUp) and reports the editor state, so the Playwright suite
# tests/web/keyboard can hold every row of the shortcuts page to it.
#
# Not a workspace member: it is test tooling, not a product crate, so the
# crate graph of site/content/architecture/overview.md (and its gate) and the
# release's excali-wasm module stay as they are. The empty [workspace] table
# keeps this package out of the root workspace.
[package]
name = "keyboard"
description = "Test harness: excali-editor's keyboard handling in the browser (ex-515)."
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
excali-core = { path = "../../crates/excali-core" }
excali-editor = { path = "../../crates/excali-editor" }
excali-text = { path = "../../crates/excali-text" }
excali-ui = { path = "../../crates/excali-ui" }
serde_json = { version = "1.0.151", features = ["preserve_order", "float_roundtrip"] }
# The wasm-bindgen the workspace's Cargo.lock pins, so the CLI installed for
# scripts/web/build.sh generates this module's glue too.
wasm-bindgen = "=0.2.129"
web-sys = { version = "0.3.106", features = [
  "Element",
  "Event",
  "KeyboardEvent",
  "MouseEvent",
  "PointerEvent",
] }

[profile.release]
opt-level = "s"
