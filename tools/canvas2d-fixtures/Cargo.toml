# ex-502: the Canvas 2D backend's fixture harness. A wasm module (built by
# scripts/web/canvas2d-fixtures.sh with wasm-bindgen --target web) that reads
# excali-raster's fixture display lists with the same loader excali-raster's
# fixture test uses (crates/excali-raster/tests/support/display_lists.rs) and
# paints them with excali_canvas2d::paint_scaled on a browser canvas, for the
# Playwright check in tests/web/canvas2d.
#
# Not a workspace member: it is test tooling, not a product crate, so the
# crate graph of site/content/architecture/overview.md (and its gate) and the
# release's excali-wasm module stay as they are. The empty [workspace] table
# keeps this package out of the root workspace.
[package]
name = "canvas2d-fixtures"
description = "Test harness: excali-canvas2d paints the raster fixture display lists in the browser (ex-502)."
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
excali-canvas2d = { path = "../../crates/excali-canvas2d" }
excali-scene = { path = "../../crates/excali-scene" }
serde_json = { version = "1.0.151", features = ["preserve_order", "float_roundtrip"] }
# The wasm-bindgen the workspace's Cargo.lock pins, so the CLI installed for
# scripts/web/build.sh generates this module's glue too.
wasm-bindgen = "=0.2.129"
js-sys = "0.3.106"
web-sys = { version = "0.3.106", features = ["CanvasRenderingContext2d", "HtmlImageElement"] }

[profile.release]
opt-level = "s"
