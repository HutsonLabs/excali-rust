# ex-512: the text editor's browser harness. A wasm module (built by
# scripts/web/text-editing.sh with wasm-bindgen --target web) that loads a
# session of upstream's text editing fixture
# (crates/excali-editor/tests/fixtures/text-editing.json) into an
# excali_editor session, starts text editing as the case does and mounts
# excali_ui::text_editor's textarea in the page, so the Playwright suite
# tests/web/text-editing can type into it and hold the elements, the app
# state and the textarea to upstream's.
#
# Not a workspace member: it is test tooling, not a product crate, so the
# crate graph of site/content/architecture/overview.md (and its gate) and the
# release's excali-wasm module stay as they are. The empty [workspace] table
# keeps this package out of the root workspace.
[package]
name = "text-editing"
description = "Test harness: excali-ui's text editor overlay in the browser (ex-512)."
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
excali-core = { path = "../../crates/excali-core" }
excali-editor = { path = "../../crates/excali-editor" }
excali-text = { path = "../../crates/excali-text" }
excali-ui = { path = "../../crates/excali-ui" }
serde_json = { version = "1.0.151", features = ["preserve_order", "float_roundtrip"] }
# The wasm-bindgen the workspace's Cargo.lock pins, so the CLI installed for
# scripts/web/build.sh generates this module's glue too.
wasm-bindgen = "=0.2.129"
web-sys = { version = "0.3.106", features = ["Document", "Element", "HtmlElement", "HtmlTextAreaElement", "Window"] }

[profile.release]
opt-level = "s"
