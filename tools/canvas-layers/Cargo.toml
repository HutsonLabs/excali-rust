# ex-503: the layered canvases' browser harness. A wasm module (built by
# scripts/web/canvas-layers.sh with wasm-bindgen --target web) that mounts
# excali_ui::layers::CanvasLayers in a page and paints its layers from
# scenes the Playwright suite tests/web/layers hands it, and exposes the
# backing size rules so the suite can hold them to Chromium's own canvas.
#
# Not a workspace member: it is test tooling, not a product crate, so the
# crate graph of site/content/architecture/overview.md (and its gate) and the
# release's excali-wasm module stay as they are. The empty [workspace] table
# keeps this package out of the root workspace.
[package]
name = "canvas-layers"
description = "Test harness: excali-ui's layered canvases in the browser (ex-503)."
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
excali-core = { path = "../../crates/excali-core" }
excali-scene = { path = "../../crates/excali-scene" }
excali-text = { path = "../../crates/excali-text" }
excali-ui = { path = "../../crates/excali-ui" }
serde_json = { version = "1.0.151", features = ["preserve_order", "float_roundtrip"] }
# The wasm-bindgen the workspace's Cargo.lock pins, so the CLI installed for
# scripts/web/build.sh generates this module's glue too.
wasm-bindgen = "=0.2.129"
web-sys = { version = "0.3.106", features = ["Element", "HtmlCanvasElement"] }

[profile.release]
opt-level = "s"
