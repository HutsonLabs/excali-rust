# Workspace clippy configuration (ex-009, ADR-011). Clippy looks for this
# file from each package's directory upwards, so it applies to every crate
# under crates/ and every harness under tools/.
#
# The f64 and f32 transcendental methods call the platform's libm, whose last
# bit differs between macOS, glibc and wasm32; upstream's numbers are V8's
# (its own fdlibm, src/base/ieee754.cc). `cargo clippy -- -D warnings`
# rejects every call to them: use excali_math::js, which ports V8's code and
# returns the same doubles on every platform. sqrt, floor, ceil, round, abs,
# mul_add and powi stay allowed (correctly rounded or exact everywhere).
# crates/excali-math/tests/js_math.rs checks that this list is complete.
disallowed-methods = [
    { path = "f64::sin", reason = "use excali_math::js (V8/fdlibm-exact on every platform): js::sin" },
    { path = "f64::cos", reason = "use excali_math::js (V8/fdlibm-exact on every platform): js::cos" },
    { path = "f64::tan", reason = "use excali_math::js (V8/fdlibm-exact on every platform): js::tan" },
    { path = "f64::sin_cos", reason = "use excali_math::js (V8/fdlibm-exact on every platform): js::sin and js::cos" },
    { path = "f64::asin", reason = "use excali_math::js (V8/fdlibm-exact on every platform): js::asin" },
    { path = "f64::acos", reason = "use excali_math::js (V8/fdlibm-exact on every platform): js::acos" },
    { path = "f64::atan", reason = "use excali_math::js (V8/fdlibm-exact on every platform): js::atan" },
    { path = "f64::atan2", reason = "use excali_math::js (V8/fdlibm-exact on every platform): js::atan2" },
    { path = "f64::exp", reason = "use excali_math::js (V8/fdlibm-exact on every platform): js::exp" },
    { path = "f64::ln", reason = "use excali_math::js (V8/fdlibm-exact on every platform): js::log" },
    { path = "f64::log", reason = "use excali_math::js (V8/fdlibm-exact on every platform): js::log, js::log2 or js::log10" },
    { path = "f64::log2", reason = "use excali_math::js (V8/fdlibm-exact on every platform): js::log2" },
    { path = "f64::log10", reason = "use excali_math::js (V8/fdlibm-exact on every platform): js::log10" },
    { path = "f64::powf", reason = "use excali_math::js (V8/fdlibm-exact on every platform): js::pow" },
    { path = "f64::hypot", reason = "use excali_math::js (V8/fdlibm-exact on every platform): js::hypot" },
    { path = "f64::cbrt", reason = "use excali_math::js (V8/fdlibm-exact on every platform): js::cbrt" },
    { path = "f64::exp2", reason = "use excali_math::js (V8/fdlibm-exact on every platform): port V8's exp2 (src/base/ieee754.cc) there first" },
    { path = "f64::exp_m1", reason = "use excali_math::js (V8/fdlibm-exact on every platform): port V8's exp_m1 (src/base/ieee754.cc) there first" },
    { path = "f64::ln_1p", reason = "use excali_math::js (V8/fdlibm-exact on every platform): port V8's ln_1p (src/base/ieee754.cc) there first" },
    { path = "f64::sinh", reason = "use excali_math::js (V8/fdlibm-exact on every platform): port V8's sinh (src/base/ieee754.cc) there first" },
    { path = "f64::cosh", reason = "use excali_math::js (V8/fdlibm-exact on every platform): port V8's cosh (src/base/ieee754.cc) there first" },
    { path = "f64::tanh", reason = "use excali_math::js (V8/fdlibm-exact on every platform): port V8's tanh (src/base/ieee754.cc) there first" },
    { path = "f64::asinh", reason = "use excali_math::js (V8/fdlibm-exact on every platform): port V8's asinh (src/base/ieee754.cc) there first" },
    { path = "f64::acosh", reason = "use excali_math::js (V8/fdlibm-exact on every platform): port V8's acosh (src/base/ieee754.cc) there first" },
    { path = "f64::atanh", reason = "use excali_math::js (V8/fdlibm-exact on every platform): port V8's atanh (src/base/ieee754.cc) there first" },
    { path = "f32::sin", reason = "use excali_math::js (V8/fdlibm-exact on every platform): js::sin_f32" },
    { path = "f32::cos", reason = "use excali_math::js (V8/fdlibm-exact on every platform): js::cos_f32" },
    { path = "f32::tan", reason = "use excali_math::js (V8/fdlibm-exact on every platform): the f64 js::tan of the widened value" },
    { path = "f32::sin_cos", reason = "use excali_math::js (V8/fdlibm-exact on every platform): js::sin_f32 and js::cos_f32" },
    { path = "f32::asin", reason = "use excali_math::js (V8/fdlibm-exact on every platform): the f64 js::asin of the widened value" },
    { path = "f32::acos", reason = "use excali_math::js (V8/fdlibm-exact on every platform): js::acos_f32" },
