    { path = "f32::atan2", reason = "use excali_math::js (V8/fdlibm-exact on every platform): the f64 js::atan2 of the widened value" },
    { path = "f32::exp", reason = "use excali_math::js (V8/fdlibm-exact on every platform): the f64 js::exp of the widened value" },
    { path = "f32::ln", reason = "use excali_math::js (V8/fdlibm-exact on every platform): the f64 js::log of the widened value" },
    { path = "f32::log", reason = "use excali_math::js (V8/fdlibm-exact on every platform): the f64 js::log, js::log2 or js::log10 of the widened value" },
    { path = "f32::log2", reason = "use excali_math::js (V8/fdlibm-exact on every platform): the f64 js::log2 of the widened value" },
    { path = "f32::log10", reason = "use excali_math::js (V8/fdlibm-exact on every platform): the f64 js::log10 of the widened value" },
    { path = "f32::powf", reason = "use excali_math::js (V8/fdlibm-exact on every platform): js::pow_f32" },
    { path = "f32::hypot", reason = "use excali_math::js (V8/fdlibm-exact on every platform): the f64 js::hypot of the widened value" },
    { path = "f32::cbrt", reason = "use excali_math::js (V8/fdlibm-exact on every platform): the f64 js::cbrt of the widened value" },
    { path = "f32::exp2", reason = "use excali_math::js (V8/fdlibm-exact on every platform): port V8's exp2 (src/base/ieee754.cc) there first" },
    { path = "f32::exp_m1", reason = "use excali_math::js (V8/fdlibm-exact on every platform): port V8's exp_m1 (src/base/ieee754.cc) there first" },
    { path = "f32::ln_1p", reason = "use excali_math::js (V8/fdlibm-exact on every platform): port V8's ln_1p (src/base/ieee754.cc) there first" },
    { path = "f32::sinh", reason = "use excali_math::js (V8/fdlibm-exact on every platform): port V8's sinh (src/base/ieee754.cc) there first" },
    { path = "f32::cosh", reason = "use excali_math::js (V8/fdlibm-exact on every platform): port V8's cosh (src/base/ieee754.cc) there first" },
    { path = "f32::tanh", reason = "use excali_math::js (V8/fdlibm-exact on every platform): port V8's tanh (src/base/ieee754.cc) there first" },
    { path = "f32::asinh", reason = "use excali_math::js (V8/fdlibm-exact on every platform): port V8's asinh (src/base/ieee754.cc) there first" },
    { path = "f32::acosh", reason = "use excali_math::js (V8/fdlibm-exact on every platform): port V8's acosh (src/base/ieee754.cc) there first" },
    { path = "f32::atanh", reason = "use excali_math::js (V8/fdlibm-exact on every platform): port V8's atanh (src/base/ieee754.cc) there first" },
]
