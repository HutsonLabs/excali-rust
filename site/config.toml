# Zola site for the excali-rust plan, design system and mockups.
# Published by .github/workflows/pages.yml to GitHub Pages (project site).
base_url = "https://hutsonlabs.github.io/excali-rust"
title = "excali-rust"
description = "A Rust port of the Excalidraw editor: no React, Tauri-ready, .excalidraw compatible."
compile_sass = true
build_search_index = false
generate_feeds = false
minify_html = false

[markdown]
render_emoji = false
external_links_target_blank = true
smart_punctuation = false

[extra]
repo = "https://github.com/HutsonLabs/excali-rust"
upstream = "https://github.com/excalidraw/excalidraw"
