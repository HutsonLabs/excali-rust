# Workspace root. House style follows term.hut's src-tauri/Cargo.toml
# (resolver 2, path crates under crates/). The crate list and the direction of
# dependencies between them are fixed by site/content/architecture/overview.md
# and ADR-008; scripts/gates/workspace.py checks this workspace against that
# page in CI.
[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "26.9.1"
edition = "2021"
# MSRV. CI checks the workspace with exactly this toolchain (rust.yml, job
# msrv); rust-toolchain.toml pins the newer stable used for development.
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/HutsonLabs/excali-rust"

[workspace.dependencies]
# preserve_order: upstream writes object keys in insertion order
# (JSON.stringify), so a read-then-write must not sort them.
# float_roundtrip: parse every number to the nearest f64, as JSON.parse does;
# the default fast path can be off by one ulp (123456789012345678901234).
serde_json = { version = "1.0.151", features = ["preserve_order", "float_roundtrip"] }
# The Serialize trait for writing a Value with a custom formatter; derive for
# the payload wrapper (excali_core::encode::EncodedData).
serde = { version = "1.0.229", features = ["derive"] }
# Insertion-ordered maps where upstream returns a JS Map (already in the
# graph through serde_json's preserve_order).
indexmap = "2.14.2"
# The WHATWG URL Standard parser (what `new URL`, `URL.hostname`,
# `URL.pathname` and `URLSearchParams` implement in the browser), for the
# library import-from-URL port (excali_core::library_url, excali_core::link).
url = "2.5.8"
# Test-only: reads the gzipped library corpus in the payload codec tests.
# excali-core's own zlib code is a port of pako (excali_core::encode), so its
# bytes and error messages are upstream's.
flate2 = "1.1.10"
# JSON Schema for .excalidraw and .excalidrawlib, derived from the model's
# types (excali_core::schema, ex-115). preserve_order keeps the published
# schema's keys in declaration order.
schemars = { version = "1.2.2", default-features = false, features = ["derive", "std", "preserve_order"] }
# Test-only: validates files against the published schemas. No remote $ref
# resolution, so no HTTP stack.
jsonschema = { version = "0.58.1", default-features = false }
# Test-only: golden digests and base64 payloads.
sha2 = "0.11.0"
base64 = "0.23.1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
