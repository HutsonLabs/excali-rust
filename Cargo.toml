# Workspace root. House style follows term.hut's src-tauri/Cargo.toml
# (resolver 2, path crates under crates/). The crate list and the direction of
# dependencies between them are fixed by site/content/architecture/overview.md
# and ADR-008; scripts/gates/workspace.py checks this workspace against that
# page in CI.
[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "26.9.1"
edition = "2021"
# MSRV. CI checks the workspace with exactly this toolchain (rust.yml, job
# msrv); rust-toolchain.toml pins the newer stable used for development.
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/HutsonLabs/excali-rust"

[workspace.dependencies]
# preserve_order: upstream writes object keys in insertion order
# (JSON.stringify), so a read-then-write must not sort them.
# float_roundtrip: parse every number to the nearest f64, as JSON.parse does;
# the default fast path can be off by one ulp (123456789012345678901234).
serde_json = { version = "1.0.151", features = ["preserve_order", "float_roundtrip"] }
# The Serialize trait for writing a Value with a custom formatter; derive for
# the payload wrapper (excali_core::encode::EncodedData).
serde = { version = "1.0.229", features = ["derive"] }
# zlib/gzip body decoding for the payload codec (ex-110). Only the pure-Rust
# miniz_oxide backend (default features), which builds for wasm32. Encoding
# does not use it: excali-core ports pako's deflate so the output is
# byte-identical to upstream's (see excali_core::encode).
flate2 = "1.1.10"
# Test-only: golden digests and base64 payloads.
sha2 = "0.11.0"
base64 = "0.23.1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
