# Workspace root. House style follows term.hut's src-tauri/Cargo.toml
# (resolver 2, path crates under crates/). The crate list and the direction of
# dependencies between them are fixed by site/content/architecture/overview.md
# and ADR-008; scripts/gates/workspace.py checks this workspace against that
# page in CI.
[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "26.9.1"
edition = "2021"
# MSRV. CI checks the workspace with exactly this toolchain (rust.yml, job
# msrv); rust-toolchain.toml pins the newer stable used for development.
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/HutsonLabs/excali-rust"

[workspace.dependencies]
# preserve_order: upstream writes object keys in insertion order
# (JSON.stringify), so a read-then-write must not sort them.
# float_roundtrip: parse every number to the nearest f64, as JSON.parse does;
# the default fast path can be off by one ulp (123456789012345678901234).
serde_json = { version = "1.0.151", features = ["preserve_order", "float_roundtrip"] }
# The Serialize trait for writing a Value with a custom formatter; derive for
# the payload wrapper (excali_core::encode::EncodedData).
serde = { version = "1.0.229", features = ["derive"] }
# Insertion-ordered maps where upstream returns a JS Map (already in the
# graph through serde_json's preserve_order).
indexmap = "2.14.2"
# The WHATWG URL Standard parser (what `new URL`, `URL.hostname`,
# `URL.pathname` and `URLSearchParams` implement in the browser), for the
# library import-from-URL port (excali_core::library_url, excali_core::link).
url = "2.5.8"
# Test-only: reads the gzipped library corpus in the payload codec tests.
# excali-core's own zlib code is a port of pako (excali_core::encode), so its
# bytes and error messages are upstream's.
flate2 = "1.1.10"
# JSON Schema for .excalidraw and .excalidrawlib, derived from the model's
# types (excali_core::schema, ex-115). preserve_order keeps the published
# schema's keys in declaration order.
schemars = { version = "1.2.2", default-features = false, features = ["derive", "std", "preserve_order"] }
# Test-only: validates files against the published schemas. No remote $ref
# resolution, so no HTTP stack.
jsonschema = { version = "0.58.1", default-features = false }
# Text measurement from font files (excali_text::font_store, ex-302, ADR-007):
# ttf-parser reads the sfnt tables (cmap, head), rustybuzz shapes each run as
# HarfBuzz does in the browser, wuff decompresses the vendored WOFF2 (and
# WOFF) files in pure Rust so the wasm32 build needs no C code, and
# unicode-properties gives the general category that keeps combining marks
# on their base's face (the version and feature rustybuzz already uses).
ttf-parser = "0.25.1"
rustybuzz = "0.20.1"
wuff = "0.2.9"
# Keeps each face parsed for shaping (rustybuzz::Face borrows its sfnt
# bytes) together with those bytes, so a face is parsed once when loaded
# rather than on every measured run. Already in the tree through url's
# IDNA (icu_collections); the derive checks the face is covariant.
yoke = { version = "0.8.3", default-features = false, features = ["alloc", "derive"] }
unicode-properties = { version = "0.1.4", default-features = false, features = ["general-category"] }
# Line breaking (excali_text::text_wrapping, ex-303): the Unicode properties
# upstream's break regexes name (\p{Script=Han}, \p{Emoji},
# \p{Extended_Pictographic}, ...) and the NFC normalization parseTokens
# applies, from ICU4X's compiled data (V8 answers both through ICU). Already
# in the tree through url's IDNA (idna_adapter), at these versions.
icu_properties = { version = "2.3.0", default-features = false, features = ["compiled_data"] }
icu_normalizer = { version = "2.3.0", default-features = false, features = ["compiled_data"] }
# fdlibm's sin and cos, the code V8's Math.sin and Math.cos run
# (src/base/ieee754.cc), so rotations give upstream's doubles on every
# platform (excali_math::js).
libm = "0.2.16"
# SVG export font subsetting (excali_svg::fonts, ex-408, ADR-010): skera,
# fontations' port of HarfBuzz's hb-subset to Rust, subsets each inlined face
# to the scene's characters with upstream's input (every layout feature),
# taking the face as skrifa's FontRef at skera's own version; ttf2woff2
# encodes the subset as WOFF2 in Rust. Both build for wasm32-unknown-unknown,
# where HarfBuzz's C++ does not (tools/font-subset-eval/wasm.json). Pinned
# exactly to the releases tools/font-subset-eval measured; excali-svg's
# tests/evaluated_versions.rs holds this manifest and Cargo.lock to that
# evaluation's pins and lockfile, so upgrading means rerunning it.
skera = { version = "=0.7.0", default-features = false }
skrifa = { version = "=0.47.0", default-features = false, features = ["std"] }
ttf2woff2 = { version = "=0.13.3", default-features = false }
# Golden digests (test-only) and base64 payloads (tests, and the data URLs
# excali-raster decodes).
sha2 = "0.11.0"
base64 = "0.23.1"

# The web runtime's release build (scripts/web/build.sh, ex-501): the size
# budget on site/content/plan/phases.md is measured on this profile's output
# after wasm-opt -Oz. opt-level "z", fat LTO and one codegen unit trade build
# time for bytes; panic = "abort" keeps unwinding tables out (wasm32 aborts
# on panic either way). Native release builds (excali-cli) keep the default
# release profile.
[profile.web-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
