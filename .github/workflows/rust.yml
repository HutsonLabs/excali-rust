  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # tauri-plugin-excali (ex-605): tauri and tauri-plugin-dialog link
      # GTK 3 and WebKitGTK 4.1 on Linux, even on the mock runtime its
      # tests use.
      - name: Tauri's Linux libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev
      - name: install the MSRV toolchain named in Cargo.toml
        id: msrv
        run: |
          msrv="$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)"
          test -n "$msrv"
          rustup toolchain install "$msrv" --profile minimal
          echo "version=$msrv" >> "$GITHUB_OUTPUT"
      - name: check with the MSRV
        run: cargo +${{ steps.msrv.outputs.version }} check --workspace --all-targets --locked

  # ex-512: the text editor. scripts/web/text-editing.sh builds the wasm
