# Rust gates on every pull request and on main: formatting, clippy with
# warnings as errors, the test suite, the published JSON Schemas against the
# model (ex-115), the crate-graph gate (the workspace must
# match site/content/architecture/overview.md), the calendar-version gate
# (ADR-009), the wasm32 build of every
# crate that targets it (ADR-008), an MSRV check, the golden harness on
# arm64 (ex-217), the roughr evaluation behind ADR-003 (ex-206), and the web
# runtime's scene font loading in Chromium (ex-307).
#
# The toolchain comes from rust-toolchain.toml; rustup installs it (with
# rustfmt, clippy and the wasm32 target) on the first cargo call.
name: rust
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --workspace --locked
      # ex-115: the published JSON Schemas (site/static/schema/) are what the
      # model generates. tests/schema.rs checks this as well; this step shows
      # the diff when they are stale.
      - name: JSON Schemas up to date
        run: |
          cargo run --locked -q -p excali-core --example write-schemas
          git diff --exit-code -- site/static/schema
      - name: crate-graph gate tests
        run: python3 scripts/gates/test_workspace.py
      - name: crate-graph gate
        run: python3 scripts/gates/workspace.py check
      # Calendar version YY.M.BUILD (ADR-009), inherited by every crate,
      # publish = false while the registry hold stands, Cargo.lock in step.
      - name: version gate tests
        run: python3 scripts/gates/test_version.py
      - name: version gate
        run: python3 scripts/gates/version.py check
      - name: wasm32 build
        run: scripts/gates/wasm-build.sh
  # ex-307: the web runtime in Chromium. scripts/web/build.sh builds
  # excali-wasm for the browser (wasm-bindgen --target web, the CLI at the
  # version Cargo.lock pins) with the fonts directory beside it, and
  # tests/web checks that registering the font manifest fetches nothing and
  # that loading a scene's fonts fetches exactly the range-split files its
  # text needs (sceneFontFiles), for every scene of the font-assets goldens.
  web-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: wasm-bindgen-cli at the Cargo.lock version
        run: |
          want="$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/"/, "", $3); print $3; exit }' Cargo.lock)"
          if [ "$(wasm-bindgen --version 2>/dev/null | awk '{ print $2 }')" != "$want" ]; then
            cargo install --locked wasm-bindgen-cli --version "$want"
          fi
      - name: build the web runtime
        run: scripts/web/build.sh
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/web/package-lock.json
      - name: install
        working-directory: tests/web
        run: npm ci
      - name: install chromium
        working-directory: tests/web
        run: npx playwright install --with-deps chromium
      # Chromium's document.fonts.check is true for an installed family, so a
      # system Liberation Sans (pulled in by --with-deps) would stop upstream's
      # check-then-load from fetching the vendored file; the suite asserts
      # no manifest family is installed.
      - name: remove system copies of manifest fonts
        run: |
          sudo apt-get remove -y 'fonts-liberation*'
          fc-cache -f
          if fc-list | grep -qi liberation; then fc-list | grep -i liberation; exit 1; fi
      - name: scene fonts load by unicode range
        working-directory: tests/web
        run: npx playwright test
        env:
          CI: "1"
      - name: keep the report and traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: web-runtime-report
          path: |
            tests/web/playwright-report/
            tests/web/test-results/
          retention-days: 14
  # ex-217: the golden harness (excali_rough::goldens, cargo feature
  # `goldens`) and every parity target that compares with goldens/ through it,
  # on arm64, the architecture the goldens were generated on (the check job
  # runs them again on x86_64 as part of the workspace tests). A failing
  # golden prints the case and element id, shape, set and op index, and the
  # expected and actual numbers; goldens_manifest checks every golden file's
  # sha256 and case count against goldens/manifest.json and its upstream
  # commit against site/config.toml.
  goldens:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: golden harness and parity tests
        run: >-
          cargo test --workspace --locked --features goldens
          --test golden_harness --test goldens_manifest --test goldens
  # ex-401: the raster backend against Chrome's canvas. The workspace tests
  # (check) hold the port to the committed references
  # (crates/excali-raster/tests/fixtures/chrome, drawn by Chrome 153); this
  # job draws every fixture display list again with the runner's Chrome
  # (scripts/fixtures/raster-references.sh --check) and holds the port to
  # those pixels within each fixture's tolerance, so a Chrome release that
  # paints differently shows up here first.
  raster-chrome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Chrome version
        run: google-chrome --version
      - name: port within tolerance of this Chrome's canvas
        env:
          CHROME: google-chrome
        run: scripts/fixtures/raster-references.sh --check
  # ex-206: the roughr evaluation behind ADR-003 (tools/roughr-eval, a
  # stand-alone package outside the workspace). Its tests fail if
  # report.json differs from a fresh run over goldens/ or ADR-003 does not
  # quote it; fork.py --check rebuilds roughr with rough.js's generator
  # patched in (park-miller.patch) and fails if report-fork.json is stale.
  # arm64, like the goldens.
  roughr-eval:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/roughr-eval
      - name: fmt
        run: cargo fmt --manifest-path tools/roughr-eval/Cargo.toml --check
      - name: clippy
        run: cargo clippy --manifest-path tools/roughr-eval/Cargo.toml --all-targets --locked -- -D warnings
      - name: tests (report.json current, ADR-003 quotes it)
        run: cargo test --manifest-path tools/roughr-eval/Cargo.toml --locked
      - name: report.json current
        run: cargo run --release --locked --manifest-path tools/roughr-eval/Cargo.toml -- --check
      - name: report-fork.json current (roughr with rough.js's generator)
        run: python3 tools/roughr-eval/fork.py --check
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: install the MSRV toolchain named in Cargo.toml
        id: msrv
        run: |
          msrv="$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)"
          test -n "$msrv"
          rustup toolchain install "$msrv" --profile minimal
          echo "version=$msrv" >> "$GITHUB_OUTPUT"
      - name: check with the MSRV
        run: cargo +${{ steps.msrv.outputs.version }} check --workspace --all-targets --locked
