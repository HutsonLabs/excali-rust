  # session typed into the textarea with the keyboard (and its selections,
  # pastes and blurs) gives upstream's elements, app state, editor style
  # and app calls after every step, the textarea carries that style as
  # Chromium parses upstream's own assignments, and it is dir=auto,
  # wrap=off in the editor's box. The fixture is the arm64 generator's; the
  # suite compares the port with it, so any platform will do.
