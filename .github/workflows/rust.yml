# Rust gates on every pull request and on main: formatting, clippy with
# warnings as errors, the test suite (on a pull request, in check and
# test-macos, only the crates scripts/gates/affected.py finds affected, and
# the golden harness only when one is; every push to main runs the whole
# workspace; owner decision 2026-09-29, ex-010), the published JSON Schemas against the
# model (ex-115), the crate-graph gate (the workspace must
# match site/content/architecture/overview.md), the calendar-version gate
# (ADR-009), the wasm32 build of every
# crate that targets it (ADR-008), the workspace tests on macOS as well as
# Linux (ex-009, ADR-011), an MSRV check, the golden harness on
# arm64 (ex-217), the roughr evaluation behind ADR-003 (ex-206), the font
# subsetting evaluation behind ADR-010 (ex-408), the web build with its gzip
# size budget (ex-501), the web runtime's scene font loading in Chromium
# (ex-307), the Canvas 2D backend against excali-raster on the fixture
# display lists in Chromium (ex-502), the catalogue render with its
# contact sheets (ex-410), and the layered canvases at device-pixel scale
# in Chromium (ex-503), and the example Tauri app in WKWebView (ex-606).
#
# The toolchain comes from rust-toolchain.toml; rustup installs it (with
# rustfmt, clippy and the wasm32 target) on the first cargo call.
name: rust
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # affected.py diffs against the base branch's merge base.
          fetch-depth: 0
      # tauri-plugin-excali (ex-605): tauri and tauri-plugin-dialog link
      # GTK 3 and WebKitGTK 4.1 on Linux, even on the mock runtime its
      # tests use.
      - name: Tauri's Linux libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev
      - name: toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # ex-010 (owner decision 2026-09-29): on a pull request, cargo test
      # runs on the affected crates only (scripts/gates/affected.py: the
      # crates owning or reading a changed file, plus their reverse
      # dependents; --workspace when a shared file changed; nothing for
      # docs and site pages no crate reads). Pushes to main run --workspace.
      - name: affected crates
        id: affected
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            args="$(python3 scripts/gates/affected.py "origin/${{ github.base_ref }}")"
          else
            args="--workspace"
          fi
          echo "cargo test args: ${args:-(none, no crate affected)}"
          echo "args=$args" >> "$GITHUB_OUTPUT"
      - name: test
        if: steps.affected.outputs.args != ''
        env:
          ARGS: ${{ steps.affected.outputs.args }}
        run: |
          # ARGS is a list of cargo arguments, split on purpose.
          # shellcheck disable=SC2086
          cargo test --locked $ARGS
      # ex-009: the golden harness and parity tests on x86_64 as well (the
      # goldens job runs them on arm64, test-macos on macOS): excali_math::js
      # returns V8's doubles on every platform, so they compare exactly here
      # too. Skipped on a pull request that affects no crate.
      - name: golden harness and parity tests (x86_64)
        if: steps.affected.outputs.args != ''
        run: >-
          cargo test --workspace --locked --features goldens
          --test golden_harness --test goldens_manifest --test goldens
          --test element_matrix
      # ex-308: stored against measured text widths across the whole corpus.
      # The workspace test run above already enforces it (0.5 px for
      # Virgil, Cascadia, Excalifont, Nunito, Lilita One and Comic Shanns,
      # report up to date); this step
      # prints the per-family max and mean deviation into the log.
      - name: text-width corpus report
        run: cargo test --locked -p excali-text --test text_width_corpus report_matches_the_committed_report -- --nocapture
      # ex-115: the published JSON Schemas (site/static/schema/) are what the
      # model generates. tests/schema.rs checks this as well; this step shows
      # the diff when they are stale.
      - name: JSON Schemas up to date
        run: |
          cargo run --locked -q -p excali-core --example write-schemas
          git diff --exit-code -- site/static/schema
      - name: crate-graph gate tests
        run: python3 scripts/gates/test_workspace.py
      - name: crate-graph gate
        run: python3 scripts/gates/workspace.py check
      # Calendar version YY.M.BUILD (ADR-009), inherited by every crate,
      # publish = false while the registry hold stands, Cargo.lock in step.
      - name: version gate tests
        run: python3 scripts/gates/test_version.py
      - name: version gate
        run: python3 scripts/gates/version.py check
      - name: wasm32 build
        run: scripts/gates/wasm-build.sh
  # ex-009: the workspace tests on macOS arm64 as well as Linux x86_64
  # (check) and Linux arm64 (goldens). The transcendental functions go
  # through excali_math::js, a port of V8's fdlibm, instead of the
  # platform's libm (which differs between macOS and glibc in the last bit),
  # and clippy.toml rejects the std methods, so every golden, corpus and
  # parity test must pass alike on each.
  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # ex-010: the affected crates on a pull request, as in check.
      - name: affected crates
        id: affected
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            args="$(python3 scripts/gates/affected.py "origin/${{ github.base_ref }}")"
          else
            args="--workspace"
          fi
          echo "cargo test args: ${args:-(none, no crate affected)}"
          echo "args=$args" >> "$GITHUB_OUTPUT"
      - name: test
        if: steps.affected.outputs.args != ''
        env:
          ARGS: ${{ steps.affected.outputs.args }}
        run: |
          # ARGS is a list of cargo arguments, split on purpose.
          # shellcheck disable=SC2086
          cargo test --locked $ARGS
      - name: golden harness and parity tests
        if: steps.affected.outputs.args != ''
        run: >-
          cargo test --workspace --locked --features goldens
          --test golden_harness --test goldens_manifest --test goldens
          --test element_matrix
  # ex-501 / ex-307: the web runtime. scripts/web/build.sh builds excali-wasm
  # for the browser into dist/ (profile web-release, wasm-bindgen --target web
  # with the CLI at the version Cargo.lock pins, wasm-opt -Oz from the pinned
  # binaryen) with the fonts directory beside it, and fails when the gzip size
  # of excali_editor_bg.wasm or excali_editor.js is over its budget on
  # site/content/plan/phases.md (scripts/gates/wasm_size.py); tests/web then
  # checks the optimised module in Chromium: that registering the font manifest fetches nothing and
  # that loading a scene's fonts fetches exactly the range-split files its
  # text needs (sceneFontFiles), for every scene of the font-assets goldens,
  # and that <excali-editor> works from plain JS as the term.hut integration
  # page documents (ex-530), and the parity suite: one test per row of the
  # parity checklist, site/content/plan/parity.md (ex-531).
  web-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: wasm-bindgen-cli at the Cargo.lock version
        run: |
          want="$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/"/, "", $3); print $3; exit }' Cargo.lock)"
          if [ "$(wasm-bindgen --version 2>/dev/null | awk '{ print $2 }')" != "$want" ]; then
            cargo install --locked wasm-bindgen-cli --version "$want"
          fi
      # scripts/web/binaryen.py downloads into .tools/ and verifies the
      # tarball's SHA-256; the cache only saves the download.
      - name: binaryen (pinned) cache
        uses: actions/cache@v6
        with:
          path: .tools/binaryen-version_133
          key: binaryen-version_133-${{ runner.os }}-${{ runner.arch }}
      - name: build the web runtime (dist/, gzip size budget)
        run: scripts/web/build.sh
      - name: gzip size budget
        run: python3 scripts/gates/wasm_size.py check dist
      - name: keep the web build
        uses: actions/upload-artifact@v7
        with:
          name: excali-web-dist
          path: |
            dist/excali_editor.js
            dist/excali_editor_bg.wasm
            dist/excali.css
          retention-days: 14
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/web/package-lock.json
      - name: install
        working-directory: tests/web
        run: npm ci
      - name: install chromium
        working-directory: tests/web
        run: npx playwright install --with-deps chromium
      # Chromium's document.fonts.check is true for an installed family, so a
      # system Liberation Sans (pulled in by --with-deps) would stop upstream's
      # check-then-load from fetching the vendored file; the suite asserts
      # no manifest family is installed.
      - name: remove system copies of manifest fonts
        run: |
          sudo apt-get remove -y 'fonts-liberation*'
          fc-cache -f
          if fc-list | grep -qi liberation; then fc-list | grep -i liberation; exit 1; fi
      # specs/fonts.spec.mjs (ex-307), specs/editor.spec.mjs (ex-530: the
      # <excali-editor> API from plain JS, undo re-laying out bound text and
      # bound arrows), specs/parity.spec.mjs (ex-531: a test per row of
      # the parity checklist, gap rows as expected failures), and
      # specs/accessibility.spec.mjs (ex-709: axe's WCAG 2.1 A/AA rules, focus
      # order, RTL mirroring; ADR-012)
      - name: scene fonts load by unicode range; the editor element; the parity checklist; accessibility
        working-directory: tests/web
        run: npx playwright test
        env:
          CI: "1"
      - name: keep the report and traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: web-runtime-report
          path: |
            tests/web/playwright-report/
            tests/web/test-results/
          retention-days: 14
  # ex-217: the golden harness (excali_rough::goldens, cargo feature
  # `goldens`) and every parity target that compares with goldens/ through it,
  # on arm64, the architecture the goldens were generated on (the check job
  # runs them again on x86_64 as part of the workspace tests). A failing
  # golden prints the case and element id, shape, set and op index, and the
  # expected and actual numbers; goldens_manifest checks every golden file's
  # sha256 and case count against goldens/manifest.json and its upstream
  # commit against site/config.toml. element_matrix (ex-g202) is the M2
  # matrix: every element type x fill style x roughness 0/1/2 x seeds
  # 1/7/1041657908, and it fails if any cell of the matrix has no case.
  goldens:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      # tauri-plugin-excali (ex-605): tauri and tauri-plugin-dialog link
      # GTK 3 and WebKitGTK 4.1 on Linux, even on the mock runtime its
      # tests use.
      - name: Tauri's Linux libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev
      - name: toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: golden harness and parity tests
        run: >-
          cargo test --workspace --locked --features goldens
          --test golden_harness --test goldens_manifest --test goldens
          --test element_matrix
  # ex-401: the raster backend against Chrome's canvas. The workspace tests
  # (check) hold the port to the committed references
  # (crates/excali-raster/tests/fixtures/chrome, drawn by Chrome 153); this
  # job draws every fixture display list again with the runner's Chrome
  # (scripts/fixtures/raster-references.sh --check) and holds the port to
  # those pixels within each fixture's tolerance, so a Chrome release that
  # paints differently shows up here first. It runs on macOS arm64, where the
  # references and the tolerances were measured: on ubuntu-latest (x64),
  # Chrome 153.0.8010.52 samples the PNG of image-elements differently from
  # macOS Chrome 153 along the edges of its two rotated, flipped draws (37
  # pixels more than 8 levels from the port, which matches macOS Chrome
  # exactly there), as the font-subset-browser job found for text.
  raster-chrome:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Chrome version
        run: '"/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --version'
      - name: port within tolerance of this Chrome's canvas
        run: scripts/fixtures/raster-references.sh --check
      - name: keep the rendered and diff images on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: raster-diff
          path: target/raster-diff/
          retention-days: 14
  # ex-g402: the PNG half of D2. The workspace tests (check) hold the port's
  # full PNG export of every fixture scene (text by the CLI's GlyphText,
  # images decoded) to the committed PNGs upstream's own exportToCanvas drew
  # in Playwright's Chromium with the vendored fonts
  # (crates/excali-cli/tests/fixtures/chrome-export); this job draws them
  # again with upstream at the pin in this runner's Chromium
  # (scripts/fixtures/chrome-png-export.sh --check) and holds the port to
  # those pixels within each scene's tolerance, canvas size exactly. On
  # macOS arm64, where the tolerances were measured: Chromium's glyph
  # rasterization is the platform's.
  chrome-png-export:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: upstream checkout at the pin
        run: scripts/upstream/checkout.sh
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            tools/goldens/package-lock.json
            tests/web/package-lock.json
      - name: install
        run: |
          npm ci --prefix tools/goldens --no-audit --no-fund
          npm ci --prefix tests/web --no-audit --no-fund
          (cd tests/web && npx playwright install chromium)
      - name: port within tolerance of upstream's export in this Chromium
        run: scripts/fixtures/chrome-png-export.sh --check
      - name: keep the port's, Chrome's and diff images on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: chrome-export-diff
          path: target/chrome-export-diff/
          retention-days: 14
  # ex-206: the roughr evaluation behind ADR-003 (tools/roughr-eval, a
  # stand-alone package outside the workspace). Its tests fail if
  # report.json differs from a fresh run over goldens/ or ADR-003 does not
  # quote it; fork.py --check rebuilds roughr with rough.js's generator
  # patched in (park-miller.patch) and fails if report-fork.json is stale.
  # arm64, like the goldens.
  roughr-eval:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/roughr-eval
      - name: fmt
        run: cargo fmt --manifest-path tools/roughr-eval/Cargo.toml --check
      - name: clippy
        run: cargo clippy --manifest-path tools/roughr-eval/Cargo.toml --all-targets --locked -- -D warnings
      - name: tests (report.json current, ADR-003 quotes it)
        run: cargo test --manifest-path tools/roughr-eval/Cargo.toml --locked
      - name: report.json current
        run: cargo run --release --locked --manifest-path tools/roughr-eval/Cargo.toml -- --check
      - name: report-fork.json current (roughr with rough.js's generator)
        run: python3 tools/roughr-eval/fork.py --check
  # ex-408: the font subsetting evaluation behind ADR-010
  # (tools/font-subset-eval, a stand-alone package outside the workspace).
  # Its tests fail if report.json differs from a fresh run over
  # upstream-subsets.json (upstream's own subsets, checked by the goldens
  # job) or ADR-010 does not quote it and the decision its rule gives;
  # wasm.sh --check rebuilds every candidate for wasm32-unknown-unknown.
  # The upstream checkout supplies the one face the port does not vendor
  # (Liberation Sans 1.05, ADR-004) for upstream's side.
  font-subset-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/font-subset-eval
      - name: upstream checkout at the pin
        run: scripts/upstream/checkout.sh
      - name: fmt
        run: cargo fmt --manifest-path tools/font-subset-eval/Cargo.toml --check
      - name: clippy
        run: cargo clippy --manifest-path tools/font-subset-eval/Cargo.toml --all-targets --locked -- -D warnings
      - name: tests (report.json current, ADR-010 quotes it and its decision)
        run: cargo test --manifest-path tools/font-subset-eval/Cargo.toml --locked
      - name: report.json current
        run: cargo run --release --locked --manifest-path tools/font-subset-eval/Cargo.toml -- --check
      - name: wasm.json current (each candidate built for wasm32-unknown-unknown)
        run: tools/font-subset-eval/wasm.sh --check
  # ex-408: render.mjs --check draws every subset in Chromium next to its
  # original face. It runs on macOS, where browser.json and ADR-010's
  # Chromium column were measured: pixel equality depends on the platform's
  # rasterizer, and on Linux upstream's own subsets draw 67 of the 279 runs
  # differently from the original face, as hb-subset's and skera's do.
  font-subset-browser:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/font-subset-eval
      - name: upstream checkout at the pin
        run: scripts/upstream/checkout.sh
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/font-subset-eval/browser/package-lock.json
      - name: install the browser check
        working-directory: tools/font-subset-eval/browser
        run: |
          npm ci --no-audit --no-fund
          npx playwright install chromium
      - name: browser.json current (every subset drawn in Chromium next to its original)
        run: |
          cargo run --release --locked --manifest-path tools/font-subset-eval/Cargo.toml -- \
            --browser tools/font-subset-eval/target/browser/cases.json
          node tools/font-subset-eval/browser/render.mjs --check
  # ex-502: the Canvas 2D backend. scripts/web/canvas2d-fixtures.sh builds
  # the wasm harness tools/canvas2d-fixtures (excali-raster's fixture loader
  # and excali_canvas2d::paint_scaled through WebCanvas), paints every
  # fixture display list in Playwright's Chromium, holds each to its
  # tolerance against the independent canvas reading in the same page
  # (scripts/fixtures/raster_references.js), then runs excali-raster's
  # fixture test against those pixels: the tiny-skia backend within each
  # fixture's tolerance of what excali-canvas2d painted. On macOS arm64,
  # where the tolerances were measured (see raster-chrome).
  canvas2d-fixtures:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            tools/canvas2d-fixtures
      - name: harness fmt
        run: cargo fmt --manifest-path tools/canvas2d-fixtures/Cargo.toml --check
      - name: harness clippy (native and wasm32)
        run: |
          cargo clippy --manifest-path tools/canvas2d-fixtures/Cargo.toml --all-targets --locked -- -D warnings
          cargo clippy --manifest-path tools/canvas2d-fixtures/Cargo.toml --target wasm32-unknown-unknown --locked -- -D warnings
      - name: harness loader tests
        run: cargo test --manifest-path tools/canvas2d-fixtures/Cargo.toml --locked
      - name: wasm-bindgen-cli at the Cargo.lock version
        run: |
          want="$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/"/, "", $3); print $3; exit }' Cargo.lock)"
          if [ "$(wasm-bindgen --version 2>/dev/null | awk '{ print $2 }')" != "$want" ]; then
            cargo install --locked wasm-bindgen-cli --version "$want"
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/web/package-lock.json
      - name: install
        working-directory: tests/web
        run: |
          npm ci
          npx playwright install chromium
      - name: excali-canvas2d paints every fixture within tolerance of excali-raster
        run: scripts/web/canvas2d-fixtures.sh
        env:
          CI: "1"
      - name: keep the painted, rendered and diff images on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: canvas2d-fixtures
          path: |
            target/canvas2d-fixtures/
            target/raster-diff/
            tests/web/playwright-report-canvas2d/
            tests/web/test-results-canvas2d/
          retention-days: 14
  # ex-410: every item of the 232 catalogue libraries rendered to PNG with
  # the release CLI: `excali lib preview` draws each library's items onto
  # the preview image upstream's publish dialog generates
  # (generatePreviewImage, components/PublishLibrary.tsx:38-105), one
  # contact sheet per library. The job fails if any library fails to
  # render, and keeps the sheets, report.json and index.html as the
  # corpus-contact-sheets artifact either way. The workspace tests run the
  # same render (crates/excali-cli/tests/corpus.rs).
  corpus-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: contact sheet script tests
        run: python3 scripts/fixtures/test_contact_sheets.py
      - name: build the CLI
        run: cargo build --release --locked -p excali-cli
      - name: render every catalogue item
        run: python3 scripts/fixtures/contact_sheets.py --excali target/release/excali --out target/contact-sheets
      - name: keep the contact sheets
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: corpus-contact-sheets
          path: target/contact-sheets/
          if-no-files-found: error
          retention-days: 14
  # ex-503: the layered canvases. scripts/web/canvas-layers.sh builds the
  # wasm harness tools/canvas-layers (excali_ui::layers::CanvasLayers with
  # the static and new-element scenes) and runs the Playwright suite
  # tests/web/layers in Chromium at device pixel ratios 1 to 3: backing
  # size = CSS size x devicePixelRatio for every canvas, upstream's stacking
  # order, classes and stylesheet rules, the port's backing size rules
  # against Chromium's HTMLCanvasElement, and painting at the scroll snapped
  # to whole device pixels (scrolls that snap alike paint identical pixels,
  # one device pixel of scroll moves the picture by one pixel). Every check
  # compares the browser with itself, so any platform will do.
  canvas-layers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            tools/canvas-layers
      - name: harness fmt
        run: cargo fmt --manifest-path tools/canvas-layers/Cargo.toml --check
      - name: harness clippy (native and wasm32)
        run: |
          cargo clippy --manifest-path tools/canvas-layers/Cargo.toml --all-targets --locked -- -D warnings
          cargo clippy --manifest-path tools/canvas-layers/Cargo.toml --target wasm32-unknown-unknown --locked -- -D warnings
      - name: wasm-bindgen-cli at the Cargo.lock version
        run: |
          want="$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/"/, "", $3); print $3; exit }' Cargo.lock)"
          if [ "$(wasm-bindgen --version 2>/dev/null | awk '{ print $2 }')" != "$want" ]; then
            cargo install --locked wasm-bindgen-cli --version "$want"
          fi
