# Build site/ with Zola and publish to GitHub Pages through the Actions
# deployment path (no gh-pages branch). Pages must be set to
# "Source: GitHub Actions" in Settings > Pages (build_type: workflow; enabled,
# first deploy confirmed 2026-09-28 by ex-005). The smoke job re-checks it.
# zola_version here and ZOLA_VERSION in scripts/site/zola.sh are the same pin.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: authorship gate
        run: python3 scripts/gates/attribution.py files --all
      - name: render task graph into the site
        run: python3 scripts/tasks/render-progress.py
      # The action builds AND uploads the github-pages artifact itself (its
      # third step); a second upload-pages-artifact here conflicts (409).
      - name: build with zola and upload the pages artifact
        uses: getzola/github-pages@066755243e69f508fd1a74739fbf1a65f656c790
        with:
          zola_version: v0.22.0
          working_directory: site
          check_links: false
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  # ex-005 acceptance, re-checked on every deploy: the base_url in
  # site/config.toml serves the home page (HTTP 200, title = site title).
  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: unit tests for the smoke check
        run: python3 -m unittest discover -s scripts/site -p 'test_*.py'
      - name: deployed home page is served
        run: python3 scripts/site/smoke.py --attempts 10 --delay 15
