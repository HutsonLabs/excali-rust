# Authorship gate in CI: the same script the local hooks run, so a commit that
# bypassed the hooks (--no-verify, a clone without core.hooksPath) still
# cannot merge with tool attribution or invisible watermarks in it. On pull
# requests, also the tracker-files gate (ex-010).
name: gates
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  attribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # ex-g001 / M0: prove the gate rejects planted violations in CI. Each
      # case plants one (tool-attribution line, Co-Authored-By trailer via
      # commit-tree, zero-width character, non-human author/committer) in a
      # scratch repo under the runner's temp dir, never in this checkout, and
      # asserts exit 1 with the rule id; a clean control must exit 0.
      - name: gate self-test (planted violations are rejected)
        run: python3 scripts/gates/test_attribution.py -v
      - name: pre-commit hook self-test (no tracker export from linked worktrees)
        run: python3 scripts/gates/test_hooks.py -v
      - name: tracked files
        run: python3 scripts/gates/attribution.py files --all
      - name: commit authors and messages
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 scripts/gates/attribution.py history "origin/${{ github.base_ref }}..HEAD"
          else
            python3 scripts/gates/attribution.py history "HEAD~1..HEAD"
          fi
      # ex-010 (owner decision 2026-09-29): a pull request carries code,
      # tests and docs; .beads/issues.jsonl, progress.md and build-log.md
      # change only in the integrator's "<id>: close in tracker, build log"
      # commit pushed to main after the merge, so this runs on PRs only.
      - name: tracker files stay out of pull requests
        if: github.event_name == 'pull_request'
        run: python3 scripts/gates/tracker_files.py check "origin/${{ github.base_ref }}"
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: unit tests for repo scripts
        run: python3 -m unittest discover -s scripts/site -p 'test_*.py' -v
      # ex-607: every code block on the integration guide is a copy of a
      # file the example hosts run.
      - name: integration guide snippets match the example hosts
        run: python3 scripts/site/snippets.py check
      # plan/tasks.json and the seed: the owner decisions of 2026-09-27
      # (ex-008) as recorded in the plan and on the process pages.
      - name: task graph and seed tests
        run: python3 scripts/tasks/test_plan.py -v
      # ex-010: the tracker-files gate and the affected-crates selection
      # rust.yml uses on pull requests (scratch repositories, no cargo).
      - name: tracker-files gate tests
        run: python3 scripts/gates/test_tracker_files.py -v
      - name: affected-crates tests
        run: python3 scripts/gates/test_affected.py -v
      # ex-501: the web build pipeline (stub toolchain: order, flags, dist/
      # outputs, the budget failing the build), the gzip size gate reading
      # its budgets from site/content/plan/phases.md, and the pinned
      # binaryen download (offline, file:// release). The real build and
      # budget run in rust.yml, job web-runtime.
      - name: web build pipeline tests
        run: python3 scripts/web/test_build.py -v
      - name: wasm size gate tests
        run: python3 scripts/gates/test_wasm_size.py -v
      - name: pinned binaryen tests
        run: python3 scripts/web/test_binaryen.py -v
      # ex-306 / ADR-004: every family's licence recorded with source URL and
      # date; a font file is vendored only for a confirmed family, with its
      # licence text beside it, and never a file listed under Licence gaps.
      - name: font licence gate self-test
        run: python3 scripts/gates/test_fonts.py -v
      - name: font licence gate
        run: python3 scripts/gates/fonts.py check
      # ex-307: crates/excali-text/assets/fonts/manifest.json and the
      # compiled table (src/font_assets/generated.rs) are what
      # scripts/fonts/assets.py writes from the upstream registry golden and
      # the files on disk; every listed file is present with its size and
      # sha256, no unlisted file is, and each licence is the recorded one.
      - name: font asset manifest matches disk
        run: python3 scripts/fonts/assets.py check
  # fixtures/ (ex-003): the manifest matches disk, the upstream copies equal
  # the pinned checkout, and every file still equals its origin URL at the
  # pinned commits (upstream and excalidraw-libraries).
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: upstream checkout at the pin
        env:
          UPSTREAM_DIR: ${{ runner.temp }}/upstream
        run: scripts/upstream/checkout.sh
      - name: corpus test suite
        env:
          UPSTREAM_DIR: ${{ runner.temp }}/upstream
        run: python3 scripts/fixtures/test_corpus.py
      - name: manifest matches disk
        run: python3 scripts/fixtures/corpus.py check
      - name: upstream copies equal the pinned checkout
        env:
          UPSTREAM_DIR: ${{ runner.temp }}/upstream
        run: python3 scripts/fixtures/corpus.py verify-upstream
      - name: ADR-004 licence-gap hashes equal the pinned upstream files
        run: python3 scripts/gates/fonts.py verify-upstream "${{ runner.temp }}/upstream"
      # ex-307: the font asset pipeline's own suite (planted changes are
      # caught), and every vendored font equals its upstream file byte for
      # byte, except the Liberation Sans substitution ADR-004 records.
      - name: font asset pipeline test suite
        env:
          UPSTREAM_DIR: ${{ runner.temp }}/upstream
        run: python3 scripts/fonts/test_assets.py -v
      - name: vendored fonts equal the pinned upstream files
        run: python3 scripts/fonts/assets.py verify-upstream "${{ runner.temp }}/upstream"
      # ex-302: excali-text's font face table is upstream's Fonts.init()
      # registry (fonts/*/index.ts, fonts.css) at the pin, and every file it
      # names is vendored under crates/excali-text/assets/fonts/.
      - name: font face table matches upstream's registry
        env:
          UPSTREAM_DIR: ${{ runner.temp }}/upstream
        run: python3 scripts/fonts/font_faces.py check
      - name: every file equals its origin (live)
        run: python3 scripts/fixtures/corpus.py verify-remote
  # ex-110: the payload codec goldens are upstream output. Regenerate them
  # from encode.ts at the pin on the exact pako release upstream locks
  # (downloaded and checked against the yarn.lock SHA-512) and fail if the
  # committed file differs. The Rust tests (rust.yml) hold the port to them.
  payload-goldens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: upstream checkout at the pin
        env:
          UPSTREAM_DIR: ${{ runner.temp }}/upstream
        run: scripts/upstream/checkout.sh
      - name: goldens match upstream encode.ts + pako
        env:
          UPSTREAM_DIR: ${{ runner.temp }}/upstream
          TOOLS_DIR: ${{ runner.temp }}/tools
        run: scripts/fixtures/payload-goldens.sh --check
  # ex-111: the PNG payload goldens are upstream output. Regenerate them from
  # image.ts at the pin on the exact png-chunk-*, crc-32, sliced and pako
  # releases upstream locks (each checked against its yarn.lock SHA-512) and
  # fail if the committed file differs; then have upstream's
  # decodePngMetadata read every PNG the port writes (the png_embed example)
  # and require the embedded text back exactly.
  png-goldens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: upstream checkout at the pin
        env:
          UPSTREAM_DIR: ${{ runner.temp }}/upstream
        run: scripts/upstream/checkout.sh
      - name: goldens match upstream image.ts; upstream decodes the port's PNGs
        env:
          UPSTREAM_DIR: ${{ runner.temp }}/upstream
          TOOLS_DIR: ${{ runner.temp }}/tools
        run: scripts/fixtures/png-goldens.sh --check
  # ex-302: the text-measurement fixtures. text-widths.json is re-extracted
  # from the library corpus and font-advances.json re-read from the vendored
  # fonts with fontTools (independent of the port's WOFF2 decoder); either
  # failing means a committed fixture is stale. The Rust side runs in
  # rust.yml (cargo test: excali-text's text_widths, font_store, ...), as
  # does ex-308's whole-corpus gate (text_width_corpus).
  text-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: font script tests (offline)
        run: python3 scripts/fonts/test_font_scripts.py -v
      - name: text-width fixture matches the corpus
        run: python3 scripts/fixtures/text_widths.py check
      - name: fontTools in a venv (the version ADR-004's verification used)
        run: |
          python3 -m venv "$RUNNER_TEMP/fonttools"
          "$RUNNER_TEMP/fonttools/bin/pip" install fonttools==4.60.2 brotli==1.2.0
      - name: glyph-advance fixture matches the vendored fonts
        run: '"$RUNNER_TEMP/fonttools/bin/python" scripts/fonts/advances.py check'
  # ex-g303: the cause of every pinned text-width deviation, in upstream's
  # own code. scripts/fixtures/text-width-causes.sh bundles upstream at the
  # pin and runs its restoreLibraryItems and restoreElements with
  # refreshDimensions, and upstream's getLineWidth of 62228e0b, in
  # Playwright's Chromium on every KNOWN_DEVIATIONS text of
  # text_width_corpus.rs, and fails unless they give the committed
  # crates/excali-text/tests/fixtures/text-width-causes.json, which the
  # Rust tests (rust.yml) hold the port to: every number within 0.001 px,
  # the tolerance of those tests, so another macOS or Chrome build may move
  # the last bits; everything else exactly. On macOS arm64, the platform the
  # fixture was measured on: Chrome on Linux rounds advances to whole pixels.
  text-width-causes:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: upstream checkout at the pin
        env:
          UPSTREAM_DIR: ${{ runner.temp }}/upstream
        run: scripts/upstream/checkout.sh
      - name: install
        run: |
          npm ci --prefix tools/goldens
          npm ci --prefix tests/web
      - name: install chromium
        working-directory: tests/web
        run: npx playwright install chromium
      - name: upstream at the pin gives the committed widths in Chrome
        env:
          UPSTREAM_DIR: ${{ runner.temp }}/upstream
        run: scripts/fixtures/text-width-causes.sh --check
  # ex-109: excali-core's ada_idna port reads ada's own IDNA table blob.
  # Take it again from the ada 4.0.0 release (the ada Node 26 bundles;
  # ada.cpp checked against its pinned SHA-256) and fail if the committed
  # tables.zlib or layout.rs differ.
  ada-idna-tables:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: table script tests (offline)
        run: python3 scripts/fixtures/test_ada_idna_tables.py -v
      - name: committed tables match ada 4.0.0
        env:
          TOOLS_DIR: ${{ runner.temp }}/tools
        run: python3 scripts/fixtures/ada-idna-tables.py --check
  # scripts/upstream/checkout.sh: the offline suite pins its behaviour
  # (fixture remotes over file://); the live step proves the real pin still
  # resolves on GitHub, lands clean, and a second run is a no-op.
  upstream-pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: checkout.sh test suite
        run: python3 scripts/upstream/test_checkout.py
      - name: live checkout at the pin
        env:
          UPSTREAM_DIR: ${{ runner.temp }}/upstream
        run: |
          scripts/upstream/checkout.sh
          scripts/upstream/checkout.sh | grep -q '^upstream already at '
          scripts/upstream/checkout.sh --verify
  # scripts/site/zola.sh must run under macOS /bin/bash 3.2 (no declare -A,
  # no sha256sum) as well as Linux bash 5. The runners put a newer bash first
  # on PATH (Homebrew bash 5 on macOS), and bootstrap.sh starts zola.sh through
  # its `#!/usr/bin/env bash` shebang, so the real download, SHA-256 check and
  # extraction are run explicitly under /bin/bash first; the step fails unless
  # it downloaded and verified against the pinned digest for the runner.
  # bootstrap then finds the verified binary and the build uses it.
  bootstrap-and-site:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: zola.sh tests under /bin/bash
        run: /bin/bash scripts/site/zola-test.sh /bin/bash
      - name: real zola download and SHA-256 check under /bin/bash
        run: |
          set -o pipefail
          /bin/bash -c 'echo "bash $BASH_VERSION"'
          log="$RUNNER_TEMP/zola-ensure.log"
          /bin/bash scripts/site/zola.sh ensure | tee "$log"
          t="$(/bin/bash scripts/site/zola.sh target)"
          d="$(/bin/bash scripts/site/zola.sh digest "$t")"
          grep -qF 'downloading https://github.com/getzola/zola/releases/download/' "$log"
          grep -qF "sha256 verified ($t $d)" "$log"
      - name: bootstrap under /bin/bash (fresh clone)
        run: /bin/bash scripts/bootstrap.sh
      - name: site build under /bin/bash
        run: /bin/bash scripts/site/zola.sh build
  # ex-006: every site page and mockup loads without console errors, failed
  # requests or HTTP errors at 1440x900, 1024x768 and 390x844. The suite
  # builds site/ with the pinned Zola (scripts/site/zola.sh) and serves it.
  site-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/site/package-lock.json
      - name: install
        run: npm ci
      - name: unit tests for the page inventory and static server
        run: npm run test:unit
      - name: install chromium
        run: npx playwright install --with-deps chromium
      - name: smoke every page and mockup at three viewports
        run: npm run test:smoke
        env:
          CI: "1"
      - name: keep the report and traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: site-smoke-report
          path: |
            tests/site/playwright-report/
            tests/site/test-results/
          retention-days: 14
  # tools/goldens: upstream's own shape code (pinned checkout) run under node
  # with roughjs 4.6.4 / perfect-freehand 1.2.0. The suite pins the package
  # versions against upstream's yarn.lock, reproduces upstream's SVG export
  # snapshot from the goldens and proves two runs are byte-identical; the
  # --check step fails the PR when goldens/ no longer matches the generator.
  # scene-fixtures.mjs --check does the same for excali-core's .excalidraw
  # fixtures, built by upstream's constructors and serializeAsJSON, and
  # restore-fixtures.mjs --check for restore-base.json and
  # restore-element.json, upstream's own restoreElementWithProperties and
  # restoreElement on tables of inputs, restore-elements-fixtures.mjs
  # --check for restore-elements.json, upstream's own restoreElements and
  # bumpElementVersions on tables of scenes, clipboard-fixtures.mjs --check
  # for clipboard.json, upstream's own serializeAsClipboardJSON and
  # parseClipboard, rough-options.mjs --check for excali-scene's
  # rough-options.json, upstream's own generateRoughOptions and
  # applyDarkModeFilter, dark-mode.mjs --check for dark-mode.json,
  # upstream's own applyDarkModeFilter, removeDarkModeFilter and rgbToHex
  # over COLOR_PALETTE and every colour notation, font-metadata.mjs --check
  # for excali-text's font-metadata.json, upstream's own FONT_METADATA,
  # getVerticalOffset, getLineHeight and family fallbacks, font-assets.mjs
  # --check for excali-text's font-assets.json, upstream's own font registry,
  # unicode-range test, containsCJK, scene font loads and
  # generateFontFaceDeclarations, text-wrapping.mjs --check for excali-text's
  # text-wrapping.json (ex-303), upstream's own parseTokens and
  # getWrappedTextLines under two line-width providers,
  # text-element-sizing.mjs --check for excali-text's
  # text-element-sizing.json (ex-305), upstream's own newTextElement,
  # refreshTextDimensions, getBoundTextMaxWidth and actionTextAutoResize on
  # tables of edits and typing sessions, and
  # library-fixtures.mjs --check for
  # library.json, upstream's own parseLibraryJSON,
  # serializeLibraryAsJSON, mergeLibraryItems and getLibraryItemsHash, and
  # library-url-fixtures.mjs --check for library-url.json, upstream's own
  # validateLibraryUrl, parseLibraryTokensFromUrl, normalizeLink and
  # toValidURL, and url-host-fixtures.mjs --check for url-hosts.json, Node's
  # own new URL (ada's IDNA) on hosts outside ASCII: cases, every code point
  # and seeded random URLs, and document-fixtures.mjs --check for
  # document-round-trip.json (ex-g101, D1), upstream's own loadFromBlob and
  # serializeAsJSON on every scene-bearing file of its test fixtures, and
  # elbow-routing-fixtures.mjs --check for excali-editor's
  # elbow-routing.json (ex-211), upstream's own updateElbowArrowPoints on
  # seeded tables of unbound, bound and fixed-segment elbow arrows, and
  # collision-fixtures.mjs --check for excali-editor's collision.json
  # (ex-507), upstream's own collision.ts and distance.ts (hitElementItself,
  # isPointInElement, intersectElementWithLineSegment, the binding hit
  # tests) on collision.test.tsx's scenes and seeded scenes of every
  # element type,
  # bucket-fill-fixtures.mjs --check for excali-editor's bucket-fill.json
  # (ex-704), upstream's own bucketFill.ts on every call of
  # bucketFill.test.ts (run as written) and seeded scenes,
  # lasso-fixtures.mjs --check for excali-editor's lasso.json (ex-705),
  # upstream's own lasso/index.ts and lasso/utils.ts (LassoTrail,
  # getLassoSelectedElementIds) on lasso.test.tsx's tests and seeded
  # scenes and paths,
  # shape-recognition-fixtures.mjs --check for excali-editor's
  # shape-recognition.json (ex-706), upstream's own convertToShape.ts
  # (recognizeShape, convertToShape, on pca.ts) on every call of
  # recognizeShape.test.ts and seeded strokes,
  # transform-fixtures.mjs --check for excali-editor's transform.json
  # (ex-508), upstream's own transformHandles.ts, resizeTest.ts and
  # resizeElements.ts (handle layouts, resizeTest, cursors, and pointer
  # gestures driven as App.tsx drives transformElements) on the scenes of
  # resize.test.tsx and seeded random scenes, and
  # linear-editor-fixtures.mjs --check for excali-editor's
  # linear-editor.json (ex-511), upstream's own LinearElementEditor (point
  # handles, midpoints and the segment length rule, addMidpoint,
  # deletePoints, addPoints, handleBoundTextDragging) on hand-written and
  # seeded lines and arrows, and
  # flowchart-fixtures.mjs --check for excali-editor's flowchart.json
  # (ex-534), upstream's own flowchart.ts (findNearestFreeSlot,
  # placeCluster, FlowChartCreator.createNodes, FlowChartNavigator
  # .exploreByDirection, isNodeInFlowchart) on hand-written and seeded
  # flowcharts, and
  # convert-element-type-fixtures.mjs --check for excali-editor's
  # convert-element-type.json (ex-535), upstream's own
  # ConvertElementTypePopup.tsx (convertElementTypes with the Panel's cache
  # priming, getConversionTypeFromElements, convertLineToElbow) on the
  # scenes of convertElementType*.test.tsx and seeded lines and arrows, and
  # binding-fixtures.mjs --check for excali-editor's binding.json (ex-510),
  # upstream's own binding.ts (fixed points, updateBoundPoint,
  # updateBoundElements, outline snapping, the binding strategies,
  # bind/unbind, updateBindings, reanchoring, the deletion and duplication
  # fixes) and interactiveScene.ts's binding highlight on hand-written and
  # seeded random scenes, and the scenes of history.test.tsx's arrow cases,
  # and snapping-fixtures.mjs --check for excali-editor's snapping.json
  # (ex-509), upstream's own snapping.ts (point and gap snaps at 8 / zoom
  # for dragged, resized and new elements, the pointer snap lines, the snap
  # cache as App.tsx fills it) and renderSnaps.ts on a recording context,
  # on hand-written and seeded random scenes, and
  # svg-export.mjs --check for excali-scene's export-bounds.json,
  # excali-svg's svg-export.json (ex-406, ex-407) and excali-core's
  # embed-links.json, upstream's own exportToSvg under jsdom 22.1.0 in test
  # mode (the document before the elements, the whole document, element
  # bounds, frame labels and canvas size) on scenes of every element kind,
  # and its getEmbedLink on links of every rule, and
  # static-scene.mjs --check for excali-scene's static-scene.json (ex-402),
  # upstream's own renderStaticScene on a recording 2D context (every draw
  # of the background, grid, elements, link icons, pending nodes and frame
  # clips), and interactive-scene.mjs --check for excali-editor's
  # interactive-scene.json (ex-713), upstream's own renderInteractiveScene
  # on the recording 2D context (selection borders, transform and crop
  # handles, the selection box, linear element handles, binding, frame and
  # element highlights, snap lines, the text box), and
  # frame-clip.mjs --check for excali-scene's frame-clip.json
  # (ex-403), upstream's own frame.ts clip decisions and element outlines
  # on the frame scenes, and canvas-layers.mjs --check for excali-ui's
  # canvas-layers.json (ex-503), upstream's own snapScrollToDevicePixels,
  # each layer's bootstrapCanvas on a canvas sized as its component sizes
  # it, and renderNewElementScene on the recording context, and
  # element-canvas.mjs --check for excali-scene's element-canvas.json
  # (ex-504), upstream's own renderElement on its editor path: each
  # element's cached bitmap (padding, size caps, scale, key) and its
  # pixel-snapped blit, and when a change regenerates the bitmap, and
  # ui-primitives.mjs --check for excali-ui's ui-primitives.json and
  # primitives.css (ex-516), upstream's own Island, Stack, Button,
  # IconButton, RadioGroup, Range, TextField, Popover, Modal, Dialog and
  # Tooltip rendered by React 19.0.0 into jsdom, their tooltip and popover
  # placement and Tab traps, and their SCSS compiled by sass 1.51.0, and
  # theme-tokens.mjs --check for excali-ui's theme-tokens.json (ex-532),
  # upstream's theme.scss compiled by sass 1.51.0 (the light, dark, mobile
  # and large-screen custom properties) and RIGHT_SIDEBAR_WIDTH, and
  # viewport.mjs --check for excali-editor's viewport.json (ex-505),
  # upstream's own getNormalizedZoom, coordinate transforms,
  # constrainScrollState, zoomToFitBounds, AppViewport.translate,
  # AppWheel.handle event by event and the zoom actions, and
  # text-editing.mjs --check for excali-editor's text-editing.json (ex-512),
  # upstream's own textWysiwyg, App.startTextEditing and handleTextWysiwyg
  # (cut out of App.tsx, run on a stand-in App under jsdom) step by step,
  # and redrawTextBoundingBox on every container type, and
  # font-subset.mjs --check for tools/font-subset-eval's
  # upstream-subsets.json (ex-408), upstream's own
  # generateFontFaceDeclarations with its harfbuzzjs subsetting of every
  # face its SVG export inlines, whose export test scenes reproduce
  # export.test.ts.snap's @font-face rules byte for byte;
  # image-elements.mjs --check for excali-scene's image-elements.json
  # (ex-404), upstream's own renderElement exporting image elements under
  # jsdom, recorded call by call (placeholders, crops, flips, rounded clips,
  # the dark filter on SVG files); and
  # png-export.mjs --check for excali-scene's canvas-export.json (ex-405),
  # upstream's own exportToCanvas and utils exportToCanvas on the recording
  # context (canvas size, every draw, the embedded scene text); then
  # upstream's loadFromBlob and decodePngMetadata read back every PNG the
  # port's png_export example writes (png-export.mjs --reimport); and
  # styles-panel.mjs --check for excali-ui's styles-panel.json (ex-519),
  # upstream's own getShapeActionPredicates, showSelectedShapeActions and
  # the full styles panel's tree (SelectedShapeActions, LayerUI's section
  # and island) on hand-written and seeded selections; and icons.mjs
  # --check for excali-ui's icons.json and src/icons/generated.rs (ex-517),
  # every icons.tsx export rendered by React's renderToStaticMarkup with
  # its size preset and mirror flag, and src/icons/icons.css, styles.scss's
  # .rtl-mirror rule (ex-709); and toolbar.mjs --check for excali-ui's
  # toolbar.json and src/toolbar/toolbar.css (ex-518), upstream's desktop
  # Toolbar and extra-tools dropdown rendered by React with radix-ui into
  # jsdom, per tool state; and convert-popup.mjs --check for excali-ui's
  # convert-popup.json and src/convert_popup/convert_popup.css (ex-535),
  # upstream's ConvertElementTypePopup rendered by React into jsdom per
  # selection; and mobile-menu.mjs --check for excali-ui's
  # mobile-menu.json and src/mobile_menu/mobile_menu.css (ex-702),
  # upstream's MobileToolbar, ToolPopover and MobileMenu rendered by React
  # with radix-ui into jsdom per tool state, width and click; and main-menu.mjs --check for
  # excali-ui's main-menu.json and src/main_menu.css (ex-520), upstream's
  # MainMenu, DefaultMainMenu and DefaultItems over the DropdownMenu
  # components (trees and the effects of each handler) and their SCSS; and
  # footer.mjs --check for excali-ui's
  # footer.json and src/footer/footer.css (ex-521), upstream's Footer
  # rendered through its ActionManager, its tooltips and clicks; and
  # help-dialog.mjs --check for excali-ui's help-dialog.json and
  # src/help_dialog/help_dialog.css (ex-522), upstream's HelpDialog in its
  # Dialog rendered by React into jsdom per platform; and
  # hints.mjs --check for excali-ui's hints.json, src/hints/hints.css and
  # src/welcome_screen/* (ex-528), upstream's HintViewer, CursorHint and
  # WelcomeScreen rendered by React into jsdom per platform; and
  # stats.mjs --check for excali-ui's stats.json and src/stats/stats.css
  # (ex-529), upstream's Stats over a real Scene rendered by React into
  # jsdom, its section headers and close button; and
  # stats-edits.mjs --check for excali-editor's stats_edits.json (ex-539),
  # upstream's Stats over a real Scene with values typed into its inputs and
  # its labels dragged, and what each callback did to the scene; and
  # editing-fixtures.mjs --check for excali-editor's editing.json (ex-712),
  # upstream's selection, group, element creation and edit action code on
  # the scenes of the gestures <excali-editor> wires, and its library
  # insertion (ex-526); and
  # color-picker.mjs --check for excali-ui's color-picker.json and
  # src/color_picker/color_picker.css (ex-523), upstream's ColorPicker
  # rendered by React with radix-ui into jsdom, its keyboard map, hex input,
  # palettes and eye-dropper placement; and color-top-picks-dnd.mjs --check
  # for excali-ui's color-top-picks-dnd.json and
  # src/top_picks_dnd/top_picks_dnd.css (ex-536), the same ColorPicker with
  # customizableTopPicks, its context menu and tip, and scripted drags
  # through upstream's TopPicksDnD on a fixed layout and a fake clock; and
  # library-sidebar.mjs --check for
  # excali-ui's library-sidebar.json and
  # src/library_sidebar/library_sidebar.css (ex-526), upstream's
  # DefaultSidebar with the LibraryMenu rendered by React with radix-ui into
  # jsdom, per case and after each step of every interaction; and
  # i18n.mjs --check for excali-ui's i18n.json and assets/locales/*.json
  # (ex-711), upstream's languages, setLanguage and t from i18n.ts and its
  # locale files copied verbatim; and
  # search-menu.mjs --check for excali-ui's search-menu.json and
  # src/search_menu/search_menu.css (ex-708), upstream's SearchMenu rendered
  # by React into jsdom after each step of every interaction, its search
  # helpers and actionToggleSearchMenu; and
  # font-picker.mjs --check for excali-ui's font-picker.json and
  # src/font_picker/font_picker.css (ex-524), upstream's FontPicker
  # rendered by React with radix-ui into jsdom under a host keeping the
  # app state, per case and step, and its keyboard map; and
  # font-top-picks-dnd.mjs --check for excali-ui's font-top-picks-dnd.json
  # (ex-538), the same FontPicker's strip context menu, tip and scripted
  # drags through upstream's TopPicksDnD on a fixed layout and a fake clock;
  # and command-palette.mjs --check for excali-ui's command-palette.json and
  # src/command_palette/command_palette.css (ex-527), upstream's
  # CommandPalette over its own actions and fuzzy search rendered by React
  # into jsdom per platform: lists, searches, keys, clicks and the toggle.
  # Runs on arm64: V8's float results for some shapes differ in the last bits
  # between x64 and arm64, and the committed goldens are the arm64 output
  # (macOS and Linux arm64 agree byte for byte).
  goldens:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: tools/goldens/.node-version
      - name: upstream checkout at the pin
        run: scripts/upstream/checkout.sh
      - name: install pinned generator dependencies
        run: npm ci --prefix tools/goldens --no-audit --no-fund
      - name: golden generator test suite
        run: node --test tools/goldens/test/
      - name: committed goldens match the generator
        run: node tools/goldens/generate.mjs --check
      - name: excali-core scene fixtures match the generator
        run: node tools/goldens/scene-fixtures.mjs --check
      - name: excali-core restore fixtures match the generator
        run: node tools/goldens/restore-fixtures.mjs --check
      - name: excali-core scene-level restore fixture matches the generator
        run: node tools/goldens/restore-elements-fixtures.mjs --check
      - name: excali-core AppState goldens match the generator
        run: node tools/goldens/app-state.mjs --check
      - name: excali-core clipboard fixtures match the generator
        run: node tools/goldens/clipboard-fixtures.mjs --check
      - name: excali-scene rough option goldens match the generator
        run: node tools/goldens/rough-options.mjs --check
      - name: excali-scene dark-mode filter goldens match the generator
        run: node tools/goldens/dark-mode.mjs --check
      - name: excali-text font metadata goldens match the generator
        run: node tools/goldens/font-metadata.mjs --check
      - name: excali-text font asset goldens match the generator
        run: node tools/goldens/font-assets.mjs --check
      - name: excali-text text wrapping goldens match upstream's parseTokens and getWrappedTextLines
        run: node tools/goldens/text-wrapping.mjs --check
      - name: excali-text text element sizing goldens match upstream's newTextElement, refreshTextDimensions and actionTextAutoResize
        run: node tools/goldens/text-element-sizing.mjs --check
      - name: excali-core library fixtures match the generator
        run: node tools/goldens/library-fixtures.mjs --check
      - name: excali-core library URL fixtures match the generator
        run: node tools/goldens/library-url-fixtures.mjs --check
      - name: excali-core URL host fixtures match Node's new URL (ada IDNA)
        run: node tools/goldens/url-host-fixtures.mjs --check
      - name: excali-core D1 fixture round-trip golden matches upstream's loadFromBlob and serializeAsJSON
        run: node tools/goldens/document-fixtures.mjs --check
      - name: excali-editor elbow routing fixture matches upstream's updateElbowArrowPoints
        run: node tools/goldens/elbow-routing-fixtures.mjs --check
      - name: excali-editor hit testing fixture matches upstream's collision.ts and distance.ts
        run: node tools/goldens/collision-fixtures.mjs --check
      - name: excali-editor bucket fill fixture matches upstream's bucketFill.ts
        run: node tools/goldens/bucket-fill-fixtures.mjs --check
      - name: excali-editor lasso fixture matches upstream's LassoTrail and getLassoSelectedElementIds
        run: node tools/goldens/lasso-fixtures.mjs --check
      - name: excali-editor shape recognition fixture matches upstream's recognizeShape and convertToShape
        run: node tools/goldens/shape-recognition-fixtures.mjs --check
      - name: excali-editor transform fixture matches upstream's transformHandles.ts, resizeTest.ts and resizeElements.ts
        run: node tools/goldens/transform-fixtures.mjs --check
      - name: excali-editor binding fixture matches upstream's binding.ts and binding highlight
        run: node tools/goldens/binding-fixtures.mjs --check
      - name: excali-editor snapping fixture matches upstream's snapping.ts and renderSnaps.ts
        run: node tools/goldens/snapping-fixtures.mjs --check
      - name: excali-editor linear element editor fixture matches upstream's LinearElementEditor
        run: node tools/goldens/linear-editor-fixtures.mjs --check
      - name: excali-editor flowchart fixture matches upstream's flowchart.ts
        run: node tools/goldens/flowchart-fixtures.mjs --check
      - name: excali-editor convert element type fixture matches upstream's ConvertElementTypePopup.tsx
        run: node tools/goldens/convert-element-type-fixtures.mjs --check
      - name: excali-editor arrow endpoint text fixture matches upstream's arrowEndpointText.ts and dragNewTextElement
        run: node tools/goldens/arrow-endpoint-text-fixtures.mjs --check
      - name: excali-scene export bounds, excali-svg document and excali-core embed link fixtures match upstream's exportToSvg and getEmbedLink
        run: node tools/goldens/svg-export.mjs --check
      - name: excali-scene static scene fixture matches upstream's renderStaticScene
        run: node tools/goldens/static-scene.mjs --check
      - name: excali-editor interactive scene fixture matches upstream's renderInteractiveScene
        run: node tools/goldens/interactive-scene.mjs --check
      - name: excali-editor crop fixture matches upstream's cropElement.ts
        run: node tools/goldens/crop-fixtures.mjs --check
      - name: excali-scene frame clipping fixture matches upstream's frame.ts
        run: node tools/goldens/frame-clip.mjs --check
      - name: excali-ui canvas layer fixture matches upstream's snapScrollToDevicePixels, bootstrapCanvas and renderNewElementScene
        run: node tools/goldens/canvas-layers.mjs --check
      - name: excali-scene per-element bitmap cache fixture matches upstream's renderElement editor path
        run: node tools/goldens/element-canvas.mjs --check
      - name: excali-ui primitive fixture and stylesheet match upstream's components and SCSS
        run: node tools/goldens/ui-primitives.mjs --check
      - name: excali-ui theme token fixture matches upstream's theme.scss
        run: node tools/goldens/theme-tokens.mjs --check
      - name: excali-ui styles panel fixture matches upstream's getShapeActionPredicates and SelectedShapeActions
        run: node tools/goldens/styles-panel.mjs --check
      - name: excali-ui icon set matches upstream's icons.tsx
        run: node tools/goldens/icons.mjs --check
      - name: excali-ui shapes toolbar fixture and stylesheet match upstream's Toolbar and ExtraToolsDropdown
        run: node tools/goldens/toolbar.mjs --check
      - name: excali-ui convert element type popup fixture and stylesheet match upstream's ConvertElementTypePopup
        run: node tools/goldens/convert-popup.mjs --check
      - name: excali-ui phone layout fixture and stylesheet match upstream's MobileToolbar, ToolPopover and MobileMenu
        run: node tools/goldens/mobile-menu.mjs --check
      - name: excali-ui main menu fixture and stylesheet match upstream's MainMenu and DefaultItems
        run: node tools/goldens/main-menu.mjs --check
      - name: excali-ui footer fixture and stylesheet match upstream's Footer, ZoomActions, UndoRedoActions, HelpButton and ExitZenModeButton
        run: node tools/goldens/footer.mjs --check
      - name: excali-ui help dialog fixture and stylesheet match upstream's HelpDialog on each platform
        run: node tools/goldens/help-dialog.mjs --check
      - name: excali-ui hints and welcome screen fixture, stylesheets and logo match upstream's HintViewer, CursorHint and WelcomeScreen
        run: node tools/goldens/hints.mjs --check
      - name: excali-ui stats panel fixture and stylesheet match upstream's Stats, its sections and drag inputs
        run: node tools/goldens/stats.mjs --check
      - name: excali-editor stats panel edits match upstream's Position, Dimension, Angle, FontSize and Multi* callbacks through DragInput
        run: node tools/goldens/stats-edits.mjs --check
      - name: excali-ui colour picker fixture and stylesheet match upstream's ColorPicker, keyboard map, ColorInput and colors.ts
        run: node tools/goldens/color-picker.mjs --check
      - name: excali-ui colour top-picks fixture and stylesheet match upstream's customizableTopPicks, TopPicksDnD, its context menu and tip
        run: node tools/goldens/color-top-picks-dnd.mjs --check
      - name: excali-ui library sidebar fixture and stylesheet match upstream's DefaultSidebar, Sidebar and LibraryMenu
        run: node tools/goldens/library-sidebar.mjs --check
      - name: excali-ui search menu fixture and stylesheet match upstream's SearchMenu and actionToggleSearchMenu
        run: node tools/goldens/search-menu.mjs --check
      - name: excali-ui locale fixture and locale files match upstream's i18n.ts and locales/*.json
        run: node tools/goldens/i18n.mjs --check
      - name: excali-ui font picker fixture and stylesheet match upstream's FontPicker, FontPickerList and keyboard map
        run: node tools/goldens/font-picker.mjs --check
      - name: excali-ui font top-picks fixture matches upstream's fontTopPicksDnD, TopPicksDnD, its context menu and tip
        run: node tools/goldens/font-top-picks-dnd.mjs --check
      - name: excali-ui command palette fixture and stylesheet match upstream's CommandPalette, its actions and fuzzy search
        run: node tools/goldens/command-palette.mjs --check
      - name: excali-editor viewport fixture matches upstream's zoom, scroll constraints, zoom-to-fit, wheel handler and zoom actions
        run: node tools/goldens/viewport.mjs --check
      - name: excali-editor text editing fixture matches upstream's textWysiwyg, startTextEditing and redrawTextBoundingBox
        run: node tools/goldens/text-editing.mjs --check
      - name: font subsetting fixture matches upstream's generateFontFaceDeclarations and harfbuzzjs subsetting
        run: node tools/goldens/font-subset.mjs --check
      - name: excali-scene image element fixture matches upstream's renderElement
        run: node tools/goldens/image-elements.mjs --check
      - name: excali-scene canvas export fixture matches upstream's exportToCanvas
        run: node tools/goldens/png-export.mjs --check
      - name: excali-editor editing fixture matches upstream's selection, groups, newElement and edit actions
        run: node tools/goldens/editing-fixtures.mjs --check
      - name: toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: upstream re-imports the port's PNG exports (loadFromBlob, decodePngMetadata)
        run: |
          cargo run --quiet --locked -p excali-raster --example png_export -- "$RUNNER_TEMP/png-export"
          node tools/goldens/png-export.mjs --reimport "$RUNNER_TEMP/png-export"
