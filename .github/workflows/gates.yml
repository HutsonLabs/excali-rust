# Authorship gate in CI: the same script the local hooks run, so a commit that
# bypassed the hooks (--no-verify, a clone without core.hooksPath) still
# cannot merge with tool attribution or invisible watermarks in it.
name: gates
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  attribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: tracked files
        run: python3 scripts/gates/attribution.py files --all
      - name: commit authors and messages
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 scripts/gates/attribution.py history "origin/${{ github.base_ref }}..HEAD"
          else
            python3 scripts/gates/attribution.py history "HEAD~1..HEAD"
          fi
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: unit tests for repo scripts
        run: python3 -m unittest discover -s scripts/site -p 'test_*.py' -v
  # scripts/upstream/checkout.sh: the offline suite pins its behaviour
  # (fixture remotes over file://); the live step proves the real pin still
  # resolves on GitHub, lands clean, and a second run is a no-op.
  upstream-pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: checkout.sh test suite
        run: python3 scripts/upstream/test_checkout.py
      - name: live checkout at the pin
        env:
          UPSTREAM_DIR: ${{ runner.temp }}/upstream
        run: |
          scripts/upstream/checkout.sh
          scripts/upstream/checkout.sh | grep -q '^upstream already at '
          scripts/upstream/checkout.sh --verify
  # ex-006: every site page and mockup loads without console errors, failed
  # requests or HTTP errors at 1440x900, 1024x768 and 390x844. The suite
  # builds site/ with the pinned Zola (scripts/site/zola.sh) and serves it.
  site-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/site/package-lock.json
      - name: install
        run: npm ci
      - name: unit tests for the page inventory and static server
        run: npm run test:unit
      - name: install chromium
        run: npx playwright install --with-deps chromium
      - name: smoke every page and mockup at three viewports
        run: npm run test:smoke
        env:
          CI: "1"
      - name: keep the report and traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: site-smoke-report
          path: |
            tests/site/playwright-report/
            tests/site/test-results/
          retention-days: 14
