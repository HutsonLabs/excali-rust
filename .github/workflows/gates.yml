# Authorship gate in CI: the same script the local hooks run, so a commit that
# bypassed the hooks (--no-verify, a clone without core.hooksPath) still
# cannot merge with tool attribution or invisible watermarks in it.
name: gates
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  attribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: tracked files
        run: python3 scripts/gates/attribution.py files --all
      - name: commit authors and messages
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 scripts/gates/attribution.py history "origin/${{ github.base_ref }}..HEAD"
          else
            python3 scripts/gates/attribution.py history "HEAD~1..HEAD"
          fi
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: unit tests for repo scripts
        run: python3 -m unittest discover -s scripts/site -p 'test_*.py' -v
  # fixtures/ (ex-003): the manifest matches disk, the upstream copies equal
  # the pinned checkout, and every file still equals its origin URL at the
  # pinned commits (upstream and excalidraw-libraries).
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: upstream checkout at the pin
        env:
          UPSTREAM_DIR: ${{ runner.temp }}/upstream
        run: scripts/upstream/checkout.sh
      - name: corpus test suite
        env:
          UPSTREAM_DIR: ${{ runner.temp }}/upstream
        run: python3 scripts/fixtures/test_corpus.py
      - name: manifest matches disk
        run: python3 scripts/fixtures/corpus.py check
      - name: upstream copies equal the pinned checkout
        env:
          UPSTREAM_DIR: ${{ runner.temp }}/upstream
        run: python3 scripts/fixtures/corpus.py verify-upstream
      - name: every file equals its origin (live)
        run: python3 scripts/fixtures/corpus.py verify-remote
  # scripts/upstream/checkout.sh: the offline suite pins its behaviour
  # (fixture remotes over file://); the live step proves the real pin still
  # resolves on GitHub, lands clean, and a second run is a no-op.
  upstream-pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: checkout.sh test suite
        run: python3 scripts/upstream/test_checkout.py
      - name: live checkout at the pin
        env:
          UPSTREAM_DIR: ${{ runner.temp }}/upstream
        run: |
          scripts/upstream/checkout.sh
          scripts/upstream/checkout.sh | grep -q '^upstream already at '
          scripts/upstream/checkout.sh --verify
  # scripts/site/zola.sh must run under macOS /bin/bash 3.2 (no declare -A,
  # no sha256sum) as well as Linux bash 5. The runners put a newer bash first
  # on PATH (Homebrew bash 5 on macOS), and bootstrap.sh starts zola.sh through
  # its `#!/usr/bin/env bash` shebang, so the real download, SHA-256 check and
  # extraction are run explicitly under /bin/bash first; the step fails unless
  # it downloaded and verified against the pinned digest for the runner.
  # bootstrap then finds the verified binary and the build uses it.
  bootstrap-and-site:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: zola.sh tests under /bin/bash
        run: /bin/bash scripts/site/zola-test.sh /bin/bash
      - name: real zola download and SHA-256 check under /bin/bash
        run: |
          set -o pipefail
          /bin/bash -c 'echo "bash $BASH_VERSION"'
          log="$RUNNER_TEMP/zola-ensure.log"
          /bin/bash scripts/site/zola.sh ensure | tee "$log"
          t="$(/bin/bash scripts/site/zola.sh target)"
          d="$(/bin/bash scripts/site/zola.sh digest "$t")"
          grep -qF 'downloading https://github.com/getzola/zola/releases/download/' "$log"
          grep -qF "sha256 verified ($t $d)" "$log"
      - name: bootstrap under /bin/bash (fresh clone)
        run: /bin/bash scripts/bootstrap.sh
      - name: site build under /bin/bash
        run: /bin/bash scripts/site/zola.sh build
