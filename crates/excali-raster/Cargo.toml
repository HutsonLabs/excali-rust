[package]
name = "excali-raster"
description = "Native PNG rendering of a display list."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
excali-scene = { path = "../excali-scene" }
# The rasterizer (site/content/evidence/_index.md: tiny-skia 0.12.0).
# default-features off: PNG encoding is not needed to paint, and std and simd
# are what the pixmaps use.
tiny-skia = { version = "0.12.0", default-features = false, features = ["std", "simd"] }

[lints]
workspace = true
