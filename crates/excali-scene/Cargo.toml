[package]
name = "excali-scene"
description = "Element shapes and the display list the render backends consume."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
excali-core = { path = "../excali-core" }
excali-math = { path = "../excali-math" }
excali-rough = { path = "../excali-rough" }

# `goldens`: turns on excali-rough's golden harness (ex-217), so
# `cargo test --workspace --features goldens` names the parity gate the same
# way in every crate. The tests below always have it.
[features]
goldens = ["excali-rough/goldens"]

# serde_json reads tests/fixtures/*.json and goldens/*.json in the parity
# tests, and the element goldens go through excali-rough's golden harness;
# neither reaches the library.
[dev-dependencies]
excali-rough = { path = "../excali-rough", features = ["goldens"] }
serde_json = { workspace = true }

[lints]
workspace = true
