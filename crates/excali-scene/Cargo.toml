[package]
name = "excali-scene"
description = "Element shapes and the display list the render backends consume."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
excali-core = { path = "../excali-core" }
excali-freehand = { path = "../excali-freehand" }
excali-math = { path = "../excali-math" }
excali-rough = { path = "../excali-rough" }
# The font faces an SVG export inlines (excali_text::font_assets) and the
# frame name font (excali_text::font_metadata).
excali-text = { path = "../excali-text" }
# The app state and files an SVG export embeds (excali_scene::export).
serde_json = { workspace = true }

# `goldens`: turns on excali-rough's golden harness (ex-217), so
# `cargo test --workspace --features goldens` names the parity gate the same
# way in every crate. The tests below always have it.
[features]
goldens = ["excali-rough/goldens"]

# The element goldens go through excali-rough's golden harness, which does
# not reach the library.
[dev-dependencies]
excali-rough = { path = "../excali-rough", features = ["goldens"] }

[lints]
workspace = true
