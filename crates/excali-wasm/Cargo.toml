[package]
name = "excali-wasm"
description = "The <excali-editor> web runtime entry point for hosts."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# cdylib: the module wasm-bindgen turns into excali_editor.js +
# excali_editor_bg.wasm (scripts/web/build.sh); rlib: native tests.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
excali-core = { path = "../excali-core" }
excali-text = { path = "../excali-text" }
excali-ui = { path = "../excali-ui" }
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = ["Document", "Window"] }

[lints]
workspace = true
