[package]
name = "excali-wasm"
description = "The <excali-editor> web runtime entry point for hosts."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# cdylib: the module wasm-bindgen turns into excali_editor.js +
# excali_editor_bg.wasm (scripts/web/build.sh); rlib: native tests.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
excali-canvas2d = { path = "../excali-canvas2d" }
excali-core = { path = "../excali-core" }
excali-editor = { path = "../excali-editor" }
excali-math = { path = "../excali-math" }
excali-scene = { path = "../excali-scene" }
excali-svg = { path = "../excali-svg" }
excali-text = { path = "../excali-text" }
excali-ui = { path = "../excali-ui" }
js-sys = "0.3.106"
serde_json = { workspace = true }
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = [
  "AddEventListenerOptions",
  "Blob",
  "BlobPropertyBag",
  "CanvasRenderingContext2d",
  "CssStyleDeclaration",
  "CustomEvent",
  "CustomEventInit",
  "Document",
  "DomRect",
  "Element",
  "Event",
  "EventTarget",
  "HtmlCanvasElement",
  "HtmlElement",
  "KeyboardEvent",
  "Location",
  "Navigator",
  "MediaQueryList",
  "Node",
  "PointerEvent",
  "TextMetrics",
  "WheelEvent",
  "Window",
] }

# The editor tests measure text with excali-text's 10 px per code unit.
[dev-dependencies]
excali-text = { path = "../excali-text", features = ["test-util"] }

[lints]
workspace = true
