[package]
name = "excali-canvas2d"
description = "Canvas 2D backend that paints a display list in the browser."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
excali-scene = { path = "../excali-scene" }
# The browser context behind excali_canvas2d::WebCanvas. Versions from the
# evidence log (site/content/evidence/_index.md: web-sys / js-sys 0.3.106).
js-sys = "0.3.106"
web-sys = { version = "0.3.106", features = [
  "CanvasRenderingContext2d",
  "CanvasWindingRule",
  "Document",
  "Element",
  "HtmlCanvasElement",
  "HtmlImageElement",
] }

# serde_json reads `cargo metadata` in the no_element_knowledge test.
[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
