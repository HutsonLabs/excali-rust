[package]
name = "excali-editor"
description = "Editor state machine: tools, hit testing, transforms, binding, snapping and history, returning effects instead of touching the DOM."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# excali-core, excali-math, excali-rough and excali-text are reached through
# excali-scene (the crate table of site/content/architecture/overview.md):
# excali-text measures and wraps text a resize rewraps, excali-rough draws
# the curve a resized line's box is read from
# (getResizedElementAbsoluteCoords); serde_json carries the element maps
# restore hands to the router (excali_core::restore::RestoreEnv).
[dependencies]
excali-core = { path = "../excali-core" }
excali-math = { path = "../excali-math" }
excali-rough = { path = "../excali-rough" }
excali-scene = { path = "../excali-scene" }
excali-text = { path = "../excali-text" }
serde_json = { workspace = true }
indexmap = { workspace = true }

# The history and transform tests lay out bound text as upstream's tests
# do, with the 10 px per code unit metric of excali-text's `test-util`
# (CharCountTextMetrics, text.length * 10).
[dev-dependencies]
excali-text = { path = "../excali-text", features = ["test-util"] }

[lints]
workspace = true
