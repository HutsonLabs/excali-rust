[package]
name = "excali-ui"
description = "DOM chrome (toolbar, panels, dialogs) that applies editor effects."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
excali-canvas2d = { path = "../excali-canvas2d" }
excali-core = { path = "../excali-core" }
excali-editor = { path = "../excali-editor" }
excali-scene = { path = "../excali-scene" }
excali-text = { path = "../excali-text" }
# The browser's FontFace / document.fonts API behind excali_ui::fonts, and
# the <canvas> elements, their wrapper, inline styles and the owner
# window's devicePixelRatio behind excali_ui::layers; the key, mouse and
# clipboard events behind excali_ui::keyboard; the textarea, its keyboard,
# clipboard, focus and pointer events, the window's timers, the canvas's
# ResizeObserver and caret measurement (Range) behind excali_ui::text_editor;
# the elements, events, focus and the tooltip's MutationObserver behind
# excali_ui::dom and excali_ui::primitives; the elements
# excali_ui::styles_panel mounts.
# excali_ui::main_menu's app state patches are JSON values, as the
# editor's app state is.
# Versions from the evidence log (site/content/evidence/_index.md).
serde_json = { workspace = true }
js-sys = "0.3.106"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = [
  "AddEventListenerOptions",
  "CanvasRenderingContext2d",
  "ClipboardEvent",
  "CssStyleDeclaration",
  "DataTransfer",
  "DataTransferItem",
  "DataTransferItemList",
  "Document",
  "DomRect",
  "DomStringMap",
  "DomTokenList",
  "DragEvent",
  "Element",
  "Event",
  "EventTarget",
  "FocusOptions",
  "FontFace",
  "FontFaceDescriptors",
  "FontFaceLoadStatus",
  "FontFaceSet",
  "HtmlBrElement",
  "HtmlCanvasElement",
  "HtmlElement",
  "HtmlHeadElement",
  "HtmlImageElement",
  "HtmlInputElement",
  "HtmlSelectElement",
  "HtmlTextAreaElement",
  "KeyboardEvent",
  "MouseEvent",
  "MutationObserver",
  "MutationObserverInit",
  "Navigator",
  "Node",
  "NodeList",
  "PointerEvent",
  "Range",
  "ResizeObserver",
  "SvgElement",
  "Text",
  "Window",
] }

[lints]
workspace = true
