[package]
name = "excali-ui"
description = "DOM chrome (toolbar, panels, dialogs) that applies editor effects."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
excali-core = { path = "../excali-core" }
excali-text = { path = "../excali-text" }
# The browser's FontFace / document.fonts API behind excali_ui::fonts.
# Versions from the evidence log (site/content/evidence/_index.md).
js-sys = "0.3.106"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = [
  "Document",
  "FontFace",
  "FontFaceDescriptors",
  "FontFaceLoadStatus",
  "FontFaceSet",
] }

[lints]
workspace = true
