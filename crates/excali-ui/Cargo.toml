[package]
name = "excali-ui"
description = "DOM chrome (toolbar, panels, dialogs) that applies editor effects."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
excali-canvas2d = { path = "../excali-canvas2d" }
excali-core = { path = "../excali-core" }
excali-scene = { path = "../excali-scene" }
excali-text = { path = "../excali-text" }
# The browser's FontFace / document.fonts API behind excali_ui::fonts, and
# the <canvas> elements, their wrapper, inline styles and the owner
# window's devicePixelRatio behind excali_ui::layers.
# Versions from the evidence log (site/content/evidence/_index.md).
js-sys = "0.3.106"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = [
  "CanvasRenderingContext2d",
  "CssStyleDeclaration",
  "Document",
  "Element",
  "FontFace",
  "FontFaceDescriptors",
  "FontFaceLoadStatus",
  "FontFaceSet",
  "HtmlCanvasElement",
  "HtmlElement",
  "HtmlImageElement",
  "Node",
  "Window",
] }

# serde_json reads the canvas layer fixture (tests/canvas_layers.rs).
[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
