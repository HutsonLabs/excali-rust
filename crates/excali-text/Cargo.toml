[package]
name = "excali-text"
description = "Font metadata, text measurement and wrapping."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
excali-core = { path = "../excali-core" }
excali-math = { path = "../excali-math" }
icu_normalizer = { workspace = true }
icu_properties = { workspace = true }
rustybuzz = { workspace = true }
serde_json = { workspace = true }
ttf-parser = { workspace = true }
unicode-properties = { workspace = true }
wuff = { workspace = true }
yoke = { workspace = true }

# `test-util`: `text_measurements::CharCountTextMetrics`, the 10 px per
# UTF-16 code unit metric upstream's own tests measure with. Off by default,
# so no library build can measure with it; test targets turn it on through
# their dev-dependencies.
[features]
test-util = []

# This crate as its own dev-dependency turns `test-util` on for `cargo test`.
# serde_json reads the JSON fixtures under tests/fixtures in the parity tests;
# flate2 and sha2 read the gzipped library corpus and check it against
# fixtures/manifest.json in the width corpus test (ex-308).
[dev-dependencies]
excali-text = { path = ".", features = ["test-util"] }
flate2 = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

[lints]
workspace = true
