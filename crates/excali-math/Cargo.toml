[package]
name = "excali-math"
description = "Geometry primitives: points, vectors, segments, curves, polygons."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# std and pxfm only (architecture overview): V8's fdlibm is ported in
# excali_math::js (src/js/ieee754.rs); pxfm is the correctly rounded pow
# behind js::pow (ADR-011).
[dependencies]
pxfm = { workspace = true }

# serde_json reads goldens/math.json in the parity test and never reaches
# the library.
[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
